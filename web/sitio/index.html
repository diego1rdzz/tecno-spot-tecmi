<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B2B">
<title>Tecno-Spot · Reparación de celulares</title>
<meta name="description" content="Reparación de celulares en la cafetería de Tecmilenio: cotiza en línea y agenda tu cita con turno.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tecno-Spot · estilos compartidos por el sitio, el portal y la consola.
   Colores de marca provisionales (por confirmar): azul noche, verde azulado y amarillo "spot". */
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --sunk:#EBEFF3; --ink:#0E1A26; --muted:#5A6977; --rule:#D5DDE5; --rule-strong:#B6C3CF;
  --brand:#0B1B2B; --accent:#0A7C86; --accent-ink:#FFFFFF; --accent-soft:#D9F0F1; --sky:#1FA9B6; --spot:#FFB020; --spot-ink:#3A2600; --spot-soft:#FFF1D6;
  --bar:#0B1B2B; --bar-ink:#EEF4F8; --bar-muted:#9FB2C2; --bar-hi:rgba(255,255,255,.12);
  --ok:#1D7348; --ok-soft:#DDF1E6; --warn:#8A5A00; --warn-soft:#FBEFD6; --crit:#B42318; --crit-soft:#FBE3E0;
  --scrim:rgba(5,16,26,.42);
  --sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#081119; --surface:#0F1C28; --sunk:#0B1620; --ink:#E4ECF2; --muted:#93A5B5; --rule:#203242; --rule-strong:#33495C;
    --brand:#BFE3E6; --accent:#45C2CC; --accent-ink:#04191C; --accent-soft:#11343A; --sky:#62D0D9; --spot:#FFB020; --spot-ink:#FFD58A; --spot-soft:#33270C;
    --bar:#06101A; --bar-ink:#E4ECF2; --bar-muted:#8DA1B3; --bar-hi:rgba(255,255,255,.10);
    --ok:#5CC48F; --ok-soft:#10301F; --warn:#E9B65C; --warn-soft:#33260E; --crit:#F2877C; --crit-soft:#3A1614;
    --scrim:rgba(0,0,0,.58);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#081119; --surface:#0F1C28; --sunk:#0B1620; --ink:#E4ECF2; --muted:#93A5B5; --rule:#203242; --rule-strong:#33495C;
  --brand:#BFE3E6; --accent:#45C2CC; --accent-ink:#04191C; --accent-soft:#11343A; --sky:#62D0D9; --spot:#FFB020; --spot-ink:#FFD58A; --spot-soft:#33270C;
  --bar:#06101A; --bar-ink:#E4ECF2; --bar-muted:#8DA1B3; --bar-hi:rgba(255,255,255,.10);
  --ok:#5CC48F; --ok-soft:#10301F; --warn:#E9B65C; --warn-soft:#33260E; --crit:#F2877C; --crit-soft:#3A1614;
  --scrim:rgba(0,0,0,.58);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--sans);}
/* La franja de la muesca del teléfono, con el color de la barra. */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Marca */
.logo{display:inline-flex;align-items:center;gap:8px;color:inherit}
.logo .isotipo{width:30px;height:30px;flex:none}
.logo .wordmark{font:700 19px/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.logo .wordmark span{color:var(--spot)}
.logo.grande .isotipo{width:44px;height:44px}
.logo.grande .wordmark{font-size:28px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand .tool{font:600 13px/1.1 var(--sans);color:var(--bar-muted);border-left:1px solid var(--bar-muted);padding-left:12px}
.topnav{display:flex;gap:2px;flex-wrap:wrap}
.topnav a,.topnav button{background:transparent;border:0;color:var(--bar-muted);font:600 14.5px/1 var(--sans);padding:10px 10px;border-radius:6px;cursor:pointer;text-decoration:none}
.topnav a:hover,.topnav button:hover{color:var(--bar-ink)}
.topnav [aria-current="page"]{background:var(--bar-hi);color:var(--bar-ink)}
.mode{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font:500 11px/1 var(--mono);padding:5px 8px;border-radius:999px;border:1px solid var(--bar-muted);color:var(--bar-ink);white-space:nowrap}
.pill.solid{background:var(--bar-hi);border-color:transparent}
.pill.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5CC48F;margin-right:6px;vertical-align:0}
@media (max-width:640px){.top{position:static}.top-in{gap:6px 12px}.mode{margin-left:0}.topnav{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;margin-inline:-6px}.topnav::-webkit-scrollbar{display:none}.topnav a,.topnav button{white-space:nowrap}}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:22px 72px}
.stack{display:grid;gap:18px;align-content:start}
.stack.tight{gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.mono{font-family:var(--mono);font-size:12.5px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* Botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 15px/1.1 var(--sans);padding:10px 15px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);cursor:pointer;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.spot{background:var(--spot);border-color:var(--spot);color:#2A1C00}
.btn.danger{color:var(--crit);border-color:var(--crit);background:transparent}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.onbar{background:transparent;border-color:var(--bar-muted);color:var(--bar-ink)}
.btn.sm{padding:6px 10px;font-size:13.5px;min-height:34px}
.btn.lg{padding:14px 22px;font-size:17px;min-height:52px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font:600 15px/1.3 var(--sans);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:var(--accent);color:var(--accent)}
label.f{display:grid;gap:5px;font:600 13.5px/1.2 var(--sans);color:var(--muted);min-width:0}
input,select,textarea{font:400 16px/1.3 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);border-radius:8px;padding:9px 11px;min-height:42px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;accent-color:var(--accent);flex:none;margin:0}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:15px;line-height:1.35;cursor:pointer}
.check input{margin-top:1px}
.err{color:var(--crit);font-size:14px;font-weight:600}

/* Marcas de estado */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--sans);padding:5px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.muted{background:var(--sunk);color:var(--muted)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font:500 11px/1 var(--mono);padding:4px 6px 3px;border-radius:4px;white-space:nowrap;vertical-align:1px}
.tag.pc{border:1px dashed var(--muted);color:var(--muted)}
.tag.demo{background:var(--sunk);color:var(--muted)}
.tag.est{background:var(--warn-soft);color:var(--warn)}

/* Superficies */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px}
.panel h3{font-size:17px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.card.attn{border-color:var(--crit);box-shadow:inset 4px 0 0 var(--crit)}
.card h3{font-size:17px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--rule-strong);padding:2px 0 2px 10px}
.callout{border-radius:10px;padding:12px 14px;font-size:15px;display:grid;gap:4px}
.callout.warn{background:var(--warn-soft)}
.callout.warn strong{color:var(--warn)}
.callout.crit{background:var(--crit-soft)}
.callout.crit strong{color:var(--crit)}
.callout.info{background:var(--accent-soft)}
.callout.spot{background:var(--spot-soft)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}

/* Tablas */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
table.t th{background:var(--sunk);text-align:left;font:600 11px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 10px;white-space:nowrap}
table.t td{padding:10px;border-top:1px solid var(--rule);vertical-align:top}
table.t td.num,table.t th.num{text-align:right}
table.t td.mono{white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--sunk)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:0}
.log li{border-top:1px solid var(--rule);padding:10px 0;display:grid;gap:3px;font-size:15px}
.log li:first-child{border-top:0}
.log .h{font:500 12px var(--mono);color:var(--muted)}

/* Indicadores */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.tile.lead{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.tile .lbl{font:600 11.5px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile .val{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.tile .sub{font-size:13.5px;color:var(--muted)}

/* Línea de tiempo de una reparación */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding-bottom:14px;position:relative}
.timeline li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--rule-strong);margin:5px 0 0 5px}
.timeline li::after{content:"";position:absolute;left:10.5px;top:20px;bottom:0;width:1px;background:var(--rule)}
.timeline li:last-child::after{display:none}
.timeline li.on::before{background:var(--accent)}
.timeline li.now::before{background:var(--spot);box-shadow:0 0 0 4px var(--spot-soft)}
.timeline b{display:block;font:600 15px/1.3 var(--sans)}
.timeline span{font-size:13.5px;color:var(--muted)}

/* Pasos */
.stagebar{display:flex;gap:4px;flex-wrap:wrap}
.stagebar span{font:600 12.5px/1 var(--sans);padding:6px 9px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.stagebar span.on{background:var(--accent);color:var(--accent-ink)}
.stagebar span.lost{background:var(--crit);color:var(--ground)}

/* Acceso */
.login{max-width:440px;margin:40px auto;display:grid;gap:16px;text-align:left}
.login h1{font-size:24px}

/* Panel lateral y avisos */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--ground);z-index:41;display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(0,0,0,.22);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{padding:16px 18px;border-bottom:1px solid var(--rule);background:var(--surface);display:flex;gap:12px;align-items:flex-start}
.drawer-head h2{font-size:21px}
.drawer-body{overflow:auto;padding:18px;display:grid;gap:18px;align-content:start;flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:8px;font:600 15px/1.3 var(--sans);max-width:min(560px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.crit{background:var(--crit);color:var(--ground)}
.toast.warn{background:var(--warn);color:var(--ground)}
/* Diálogo de confirmación */
.dlg-scrim{z-index:50}
.dlg{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px;display:grid;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.dlg p{font:600 16.5px/1.4 var(--sans)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.foot-sys{max-width:1240px;margin:0 auto;padding:0 16px 28px;font-size:13px;color:var(--muted)}

/* Hojas imprimibles */
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,.toast{display:none!important}
  #print{display:block;font:12.5px/1.45 var(--sans);color:#000}
  #print h1{font:700 20px/1.2 var(--display);margin:0 0 4px}
  #print h2{font:700 14px/1.2 var(--display);margin:14px 0 6px}
  #print table{border-collapse:collapse;width:100%}
  #print td,#print th{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  #print .firma{margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
  #print .firma div{border-top:1px solid #000;padding-top:4px;text-align:center}
  #print .pie{margin-top:14px;font-size:11px;color:#333}
}
/* Sitio público: asistente paso a paso, tienda y consulta por folio. */
.hero{background:var(--bar);color:var(--bar-ink);padding:26px 16px 64px;background-image:radial-gradient(circle at 88% 0%,rgba(255,176,32,.20),transparent 42%),radial-gradient(circle at 0% 100%,rgba(31,169,182,.22),transparent 45%)}
.hero.corto{padding-bottom:58px}
.hero-in{max-width:980px;margin:0 auto;display:grid;gap:10px}
.hero .eyebrow{color:var(--spot)}
.hero .lede{font-size:18px;line-height:1.45;max-width:680px;color:var(--bar-ink)}
main.sitio{max-width:980px;padding-top:0}
.hero + main.sitio{margin-top:-46px}
.seccion{display:grid;gap:14px;padding-top:30px}
.seccion h1{font-size:clamp(26px,4.5vw,36px)}
.seccion h2{font-size:22px}

/* Asistente */
.asistente{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:20px;display:grid;gap:18px;box-shadow:0 14px 40px rgba(5,16,26,.10);scroll-margin-top:12px}
@media (min-width:720px){.asistente{padding:26px 28px}}
.paso-h{display:grid;gap:6px}
.paso-h h1,.paso-h h2{font-size:clamp(25px,4.6vw,34px)}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.stepper li>*{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--sunk);color:var(--muted);font:600 13.5px/1 var(--sans);border:0}
.stepper li b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface);font:700 12px/1 var(--sans)}
.stepper li.hecho>*{background:var(--accent-soft);color:var(--accent);cursor:pointer}
.stepper li.hecho b{background:var(--accent);color:var(--accent-ink)}
.stepper li.actual>*{background:var(--spot);color:#2A1C00}
.stepper li.actual b{background:#2A1C00;color:var(--spot)}
@media (max-width:560px){.stepper li:not(.actual) span{display:none}.stepper li:not(.actual)>*{padding-right:6px}}
.resumen{display:flex;flex-wrap:wrap;gap:8px}
.resumen .r{display:inline-flex;gap:6px;align-items:center;background:var(--sunk);border-radius:999px;padding:6px 11px 6px 8px;font:600 14px/1.2 var(--sans)}
.resumen .ico{width:18px;height:18px;color:var(--accent)}

.opciones{display:grid;gap:10px}
.opciones.prob{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.opciones.marcas{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opciones.modelos{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));max-height:440px;overflow:auto;padding:2px}
.opciones.motivos{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.opcion{display:grid;gap:5px;align-content:start;text-align:left;background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:14px;cursor:pointer;color:var(--ink);transition:border-color .12s,transform .12s}
.opcion:hover{border-color:var(--accent);transform:translateY(-1px)}
.opcion[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opcion .ico{width:30px;height:30px;color:var(--accent);margin-bottom:4px}
.opcion b{font:700 16.5px/1.25 var(--display)}
.opcion span{font-size:14px;color:var(--muted);line-height:1.35}
.opcion.urgente .ico{color:var(--sky)}
.opcion.marca{padding:16px 14px}
.opcion.marca b{font-size:18px}
.opcion.modelo{padding:11px 12px;border-radius:10px}
.opcion.modelo b{font:600 15.5px/1.2 var(--sans)}
.opcion.modelo span{font-size:12.5px}
label.buscar{flex:1 1 280px;max-width:420px}
.manual{max-width:460px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14.5px}
.tip .ico{width:20px;height:20px;color:var(--accent);margin-top:1px}
.tip.urgente{background:var(--warn-soft)}
.tip.urgente .ico{color:var(--warn)}
.volver{border-top:1px solid var(--rule);padding-top:12px}

/* Cotización */
.cotiz{display:grid;gap:16px}
.cotiz-h{display:flex;gap:14px;align-items:center}
.cotiz-h h3{font-size:21px}
.ico.grande{width:46px;height:46px;padding:9px;border-radius:12px;background:var(--accent-soft);color:var(--accent);box-sizing:content-box}
fieldset.ops{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
fieldset.ops legend{font:700 16px/1.3 var(--display);margin-bottom:8px;padding:0}
.op{display:flex;gap:12px;align-items:center;border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.op:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.op-t{display:grid;gap:2px;flex:1;min-width:0}
.op-t b{font:600 16px/1.25 var(--sans)}
.op-p{font:700 18px/1 var(--display);white-space:nowrap;text-align:right}
.sigue{background:var(--sunk);border-radius:12px;padding:14px 16px}
.sigue h4{font-size:15px;margin-bottom:6px}
.sigue ol{margin:0;padding-left:20px;display:grid;gap:4px}
.req h4{font-size:16px;margin-bottom:6px}
.req ul,.lista{margin:0;padding-left:20px;display:grid;gap:4px}

/* Cita */
.dias{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.dia{flex:none;display:grid;gap:3px;text-align:left;min-width:112px;border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);cursor:pointer}
.dia b{font:700 15px/1.1 var(--display)}
.dia span{font-size:12.5px;color:var(--muted)}
.dia[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.hora{border:1.5px solid var(--rule);border-radius:10px;padding:10px 6px;background:var(--surface);color:var(--ink);font:600 15.5px/1 var(--sans);cursor:pointer;display:grid;gap:3px;justify-items:center}
.hora span{font-size:11px;font-weight:500;color:var(--muted)}
.hora[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dia:disabled,.hora:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.dia:not(:disabled):hover,.hora:not(:disabled):hover{border-color:var(--accent)}

/* Turno */
.ticket{display:grid;grid-template-columns:auto 1fr;gap:0;border-radius:16px;overflow:hidden;border:1.5px solid var(--spot)}
.ticket-turno{background:var(--spot);color:#2A1C00;display:grid;place-content:center;text-align:center;padding:18px 26px}
.ticket-turno span{font:600 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em}
.ticket-turno b{font:800 64px/1 var(--display)}
.ticket-info{padding:16px 18px;display:grid;gap:6px;align-content:center;background:var(--spot-soft)}
.ticket-info h3{font-size:22px}
.ticket-info .grande{font-size:18px}
.ticket-info p{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ticket-info .ico{width:18px;height:18px}
.folio{font-size:15px;font-weight:600;background:var(--surface);padding:3px 7px;border-radius:6px;user-select:all}
@media (max-width:480px){.ticket{grid-template-columns:1fr}.ticket-turno{padding:14px}}
.card h4{font-size:16px}

/* Secciones de inicio */
.como{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.como li{display:grid;gap:6px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px}
.como .ico{color:var(--accent);width:28px;height:28px}
.como b{font:700 16px/1.25 var(--display)}
.como span{font-size:14.5px;color:var(--muted)}
.servicios{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.servicio{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;cursor:pointer;color:var(--ink)}
.servicio:hover{border-color:var(--accent)}
.servicio .ico{color:var(--accent);width:28px;height:28px}
.servicio b{font:700 16.5px/1.25 var(--display)}
.servicio span{font-size:14.5px;color:var(--muted)}

/* Tienda */
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.filtro{border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;font:600 14px/1 var(--sans);cursor:pointer}
.filtro[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.productos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.producto{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start}
.producto h3{font-size:17px}
.precio{font:700 22px/1.1 var(--display)}

/* Consulta */
.consulta-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
details summary{cursor:pointer;font-weight:600}

/* Pie */
.pie{background:var(--surface);border-top:1px solid var(--rule);margin-top:20px}
.pie-in{max-width:980px;margin:0 auto;padding:24px 16px 36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.pie .logo{color:var(--ink)}
</style>

  ents(extra).forEach(([k, v]) => { out[k] = v && typeof v === 'object' && !Array.isArray(v) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k]) ? mezclar(out[k], v) : v; });

}

/* ---------- almacenamiento ---------- */
/* Los datos de demostración traen fechas fijas; se recorren para que "hoy" siempre tenga turnos. */
function anclar(data){
  const a = data._ancla; if (!a) return data;
  const n = difDias(hoyISO(), a); if (!n) return data;
  return JSON.parse(JSON.stringify(data).replace(/"(\d{4}-\d{2}-\d{2})"/g, (m, d) => '"' + sumarDias(d, n) + '"'));
}
function loadLocal(){
  let data = null;
  try { const raw = localStorage.getItem(LS_KEY); if (raw) data = JSON.parse(raw); } catch (e) { data = null; }
  if (!data) data = anclar(clone(SEED));
  COLS.forEach(c => { S[c] = data[c] || {}; Store.loaded[c] = true; });
  Store.ultimaSync = Date.now();
}
function saveLocal(){ const d = {}; COLS.forEach(c => { d[c] = S[c]; }); try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) {} }
/* Otra pestaña con otra herramienta abierta (modo local) escribe en el mismo almacenamiento. */
window.addEventListener('storage', e => { if (e.key === LS_KEY && Store.mode === 'local'){ loadLocal(); scheduleRender(); } });
function resetDemo(){ const d = anclar(clone(SEED)); COLS.forEach(c => { S[c] = d[c] || {}; }); saveLocal(); scheduleRender(); }

const chains = {};
function put(col, id, data){
  if (data === null) delete S[col][id]; else S[col][id] = data;
  scheduleRender();
  if (Store.sb){
    const k = col + '/' + id, t = Store.sb.from(col);
    const q = () => data === null ? t.delete().eq('id', id) : col === 'movimientos' ? t.insert({ id, data }) : t.upsert({ id, data });
    const p = (chains[k] || Promise.resolve()).then(q).then(r => { if (r && r.error) onWriteError(r.error); }).catch(onWriteError);
    chains[k] = p; return p;
  }
  saveLocal(); return Promise.resolve();
}
function onWriteError(e){
  const code = e && e.code;
  toast(code === '42501' ? 'Tu rol no puede hacer este cambio. Lo decide la base de datos.' : 'No se pudo guardar: ' + ((e && e.message) || 'revisa la conexión') + '.', 'crit');
}

const esInterno = () => !!ROLES[rolCuenta()];
/* ¿La cuenta que entró puede usar esta herramienta? */
function accesoOk(){
  if (Store.mode !== 'supabase' || acceso() === 'publico') return true;
  if (!Auth.session || !Auth.perfil) return false;
  return acceso() === 'interno' ? esInterno() : (rolCuenta() === 'cliente' && !!Auth.perfil.cliente_id);

/* Afuera (sitio y portal) solo se leen tablas públicas; lo del cliente llega por ts_mi_cuenta. */
const PUBLICAS = ['config','modelos','tarifas','productos','existencias'];
function colsPara(){ return acceso() === 'interno' && accesoOk() ? COLS.slice() : PUBLICAS.slice(); }
async function cargar(){
  const sb = Store.sb; COLS.forEach(c => { S[c] = {}; Store.loaded[c] = false; }); S.perfiles = {};
  const cols = colsPara();
  const tareas = cols.map(async c => {
    let q = sb.from(c).select('id,data');
    if (c === 'movimientos') q = q.order('actualizado', { ascending:false }).limit(400);
    const r = await q; if (r.error) throw r.error;
    const m = {}; (r.data || []).forEach(x => { m[x.id] = x.data; }); S[c] = m;
  });
  /* Afuera, los celulares a la venta llegan sin IMEI ni costo. */
  if (acceso() !== 'interno' || !accesoOk()) tareas.push(sb.rpc('ts_tienda').then(r => { if (r.error) throw r.error; const m = {}; (r.data || []).forEach(x => { m[x.id] = x.data; }); S.equipos = m; }));
  if (rolCuenta() === 'direccion' && acceso() === 'interno') tareas.push(sb.from('perfiles').select('*').then(r => { if (!r.error) (r.data || []).forEach(x => { S.perfiles[x.user_id] = x; }); }));
  try { await Promise.all(tareas); Store.error = null; } catch (e) { Store.error = (e && e.message) || 'sin conexión'; }
  COLS.forEach(c => { Store.loaded[c] = true; });
  Store.ultimaSync = Date.now();
  escuchar(cols);
  scheduleRender();
}
let canal = null;
function escuchar(cols){
  const sb = Store.sb; if (canal){ sb.removeChannel(canal); canal = null; }
  canal = sb.channel('ts-' + Math.random().toString(36).slice(2));
  const tablas = cols.filter(t => !(t === 'equipos' && acceso() !== 'interno')).concat(rolCuenta() === 'direccion' && acceso() === 'interno' && accesoOk() ? ['perfiles'] : []);
  tablas.forEach(t => canal.on('postgres_changes', { event:'*', schema:'public', table:t }, ev => {
    if (t === 'perfiles'){ const row = ev.new && ev.new.user_id ? ev.new : null; if (row) S.perfiles[row.user_id] = row; else if (ev.old) delete S.perfiles[ev.old.user_id]; }
    else if (ev.eventType === 'DELETE'){ if (ev.old) delete S[t][ev.old.id]; }
    else if (ev.new){ S[t][ev.new.id] = ev.new.data; }
    Store.ultimaSync = Date.now(); scheduleRender();
  }));
  canal.subscribe();
}
async function leerPerfil(){
  Auth.perfil = null;
  if (!Auth.session) return;
  const r = await Store.sb.from('perfiles').select('*').eq('user_id', Auth.session.user.id).maybeSingle();
  Auth.perfil = r.data || { rol:'pendiente', correo:Auth.session.user.email };
  if (esInterno()){ U.rol = Auth.perfil.rol; U.persona = Auth.perfil.nombre || ''; }
  if (Auth.perfil.rol === 'cliente') U.pCliente = Auth.perfil.cliente_id || '';
}
async function iniciarSupabase(){
  const sb = window.supabase.createClient(SBCFG.url, SBCFG.key);
  Store.sb = sb; Store.mode = 'supabase';
  const r = await sb.auth.getSession(); Auth.session = r.data ? r.data.session : null;
  await leerPerfil();
  await cargar();
  sb.auth.onAuthStateChange((ev, session) => {
    const antes = Auth.session && Auth.session.user.id, ahora = session && session.user.id;
    Auth.session = session;
    if (antes !== ahora) setTimeout(async () => { await leerPerfil(); await cargar(); }, 0);
  });
}
async function rpc(fn, args){ const r = await Store.sb.rpc(fn, args); if (r.error) throw new Error(r.error.message); return r.data; }

/* ---------- catálogo: modelos y tarifas ---------- */
function modelosDe(marca){
  return ents(S.modelos).filter(([, m]) => m.marca === marca && !m.oculto).sort((a, b) => (a[1].orden || 0) - (b[1].orden || 0) || a[1].modelo.localeCompare(b[1].modelo, 'es'));
}
const marcasActivas = () => MARCAS.concat([...new Set(vals(S.modelos).map(m => m.marca))].filter(m => !MARCAS.includes(m)));
function nombreModelo(id, texto){ const m = S.modelos[id]; return m ? m.marca + ' ' + m.modelo : (texto || 'Modelo por confirmar'); }
const tarifaId = (modeloId, problema, calidad) => modeloId + '|' + problema + '|' + (slug(calidad) || 'unica');
function tarifasDe(modeloId, problema){
  return ents(S.tarifas).filter(([, t]) => t.modeloId === modeloId && t.problema === problema && !t.oculta)
    .sort((a, b) => (a[1].precio == null ? 1e12 : a[1].precio) - (b[1].precio == null ? 1e12 : b[1].precio));
}
/* La cotización que ve el cliente: solo lo que la tienda ya cargó; lo demás, por confirmar. */
function cotizar(modeloId, problema){
  const ops = modeloId ? tarifasDe(modeloId, problema).map(([id, t]) => ({ tarifaId:id, calidad:t.calidad || '', precio:t.precio == null ? null : +t.precio, tiempo:t.tiempo || null, garantia:garantiaDias(problema, t), demo:!!t.demo })) : [];
  return { problema, opciones:ops, garantia:garantiaDias(problema), diagnostico:cfg().diagnostico.precio };
}

/* ---------- citas y turnos ---------- */
function horasDelDia(fecha){
  const c = cfg().citas;
  if (!(c.dias || []).includes(fechaDe(fecha).getDay())) return [];
  const out = []; const fin = aMin(c.fin), paso = Math.max(10, +c.intervalo || 30);
  for (let m = aMin(c.inicio); m + paso <= fin; m += paso) out.push(deMin(m));
  return out;
}
const citaActiva = c => c.estado !== 'cancelada';
function ocupacionDe(fecha){
  if (Store.mode === 'supabase' && acceso() !== 'interno') return S.ocupacion[fecha] || {};
  const m = {}; vals(S.citas).forEach(c => { if (c.fecha === fecha && citaActiva(c) && c.hora) m[c.hora] = (m[c.hora] || 0) + 1; }); return m;
}
/* Horarios del día con lugares libres; hoy no ofrece horas que ya pasaron. */
function horarios(fecha){
  const occ = ocupacionDe(fecha), cupo = +cfg().citas.cupo || 1, ahora = fecha === hoyISO() ? aMin(ahoraHM()) + 15 : -1;
  return horasDelDia(fecha).map(h => ({ hora:h, libres:Math.max(0, cupo - (occ[h] || 0)), pasada:aMin(h) < ahora }));
}
function diasAgenda(){
  const n = +cfg().citas.diasVisibles || 8, out = []; let d = hoyISO();
  for (let i = 0; out.length < n && i < 40; i++, d = sumarDias(d, 1)) if (horarios(d).some(h => !h.pasada)) out.push(d);
  return out;
}
async function cargarOcupacion(){
  if (!Store.sb || acceso() === 'interno') return;
  const dias = diasAgenda(); if (!dias.length) return;
  try {
    const r = await rpc('ts_horarios', { desde:dias[0], hasta:dias[dias.length - 1] });
    S.ocupacion = {}; (r || []).forEach(x => { (S.ocupacion[x.fecha] = S.ocupacion[x.fecha] || {})[x.hora] = x.n; });
    scheduleRender();
  } catch (e) { Store.error = e.message; }
}
const siguienteTurno = fecha => vals(S.citas).filter(c => c.fecha === fecha).reduce((a, c) => Math.max(a, +c.turno || 0), 0) + 1;
function historialCita(c, nota){ c.historial = (c.historial || []).concat([{ fecha:hoyISO(), hora:ahoraHM(), autor:quien(), nota }]); }
/* Agenda una cita y le da su turno del día. Afuera pasa por la base (ts_agendar). */
async function agendar(d){
  if (Store.sb) return rpc('ts_agendar', { p:d });
  const h = horarios(d.fecha).find(x => x.hora === d.hora);
  if (!h || h.pasada) throw new Error('Ese horario ya no está disponible. Elige otro.');
  if (!h.libres) throw new Error('Ese horario se acaba de llenar. Elige otro.');
  if ((d.contacto.nombre || '').trim().length < 2 || digitos(d.contacto.tel).length !== 10) throw new Error('Escribe tu nombre y un celular de 10 dígitos.');
  const c = crearCita(Object.assign({ origen:'sitio' }, d));
  return { folio:c.folio, fecha:c.fecha, hora:c.hora, turno:c.turno, lugar:c.lugar };
}
function crearCita(d){
  const id = uid('ct'), E = empresa();
  const c = Object.assign({ folio:nuevoFolio('CT'), motivo:'reparacion', modalidad:'cafeteria', lugar:E.lugar, clienteId:null, cotizacion:null, nota:'', estado:'agendada', origen:'mostrador', creada:hoyISO() }, d);
  c.turno = siguienteTurno(c.fecha);
  c.contacto = { nombre:(d.contacto.nombre || '').trim(), tel:digitos(d.contacto.tel), correo:(d.contacto.correo || '').trim(), tecmi:!!d.contacto.tecmi };
  if (!c.clienteId){ const cl = clientePorTel(c.contacto.tel); if (cl) c.clienteId = cl[0]; }
  historialCita(c, 'Cita agendada · ' + (c.origen === 'sitio' ? 'desde el sitio' : c.origen === 'portal' ? 'desde el portal' : 'en mostrador'));
  put('citas', id, c);
  return Object.assign({ id }, c);
}
function citaEdit(id, fn){ const c = clone(S.citas[id]); if (!c) return; if (fn(c) === false) return; put('citas', id, c); }
function nombreCita(c){ const cl = S.clientes[c.clienteId]; return cl ? cl.nombre : (c.contacto && c.contacto.nombre) || 'Sin nombre'; }

/* ---------- clientes ---------- */
function clientePorTel(tel){ const d = digitos(tel); return d.length === 10 ? ents(S.clientes).find(([, c]) => digitos(c.tel) === d) || null : null; }
function crearCliente(d){
  const id = uid('cl');
  put('clientes', id, { nombre:(d.nombre || '').trim(), tel:digitos(d.tel), correo:(d.correo || '').trim(), tecmi:!!d.tecmi, alta:hoyISO(), dispositivos:[], bitacora:[] });
  return id;
}
function bitacora(cid, entry){
  if (!S.clientes[cid]) return;
  const c = clone(S.clientes[cid]);
  c.bitacora = [Object.assign({ fecha:hoyISO(), autor:quien() }, entry)].concat(c.bitacora || []).slice(0, 150);
  put('clientes', cid, c);
}
/* Regla 6: el equipo entregado o vendido queda en la ficha del cliente con su IMEI. */
function registrarDispositivo(cid, disp){
  const c = clone(S.clientes[cid]); if (!c) return;
  c.dispositivos = c.dispositivos || [];
  const i = disp.imei ? c.dispositivos.findIndex(x => x.imei === disp.imei) : -1;
  const reg = Object.assign({ id:uid('eq'), alta:hoyISO() }, i >= 0 ? c.dispositivos[i] : {}, disp);
  if (i >= 0) c.dispositivos[i] = reg; else c.dispositivos.push(reg);
  put('clientes', cid, c);
}
const nombreCliente = id => (S.clientes[id] && S.clientes[id].nombre) || 'Cliente sin registro';

/* ---------- costos y utilidad (regla 4) ---------- */
const verCostos = () => U.rol === 'direccion' || U.rol === 'administracion';
function costo(id){ const c = S.costos[id]; return c && c.costo != null && c.costo !== '' ? +c.costo : null; }
const montoLineas = ls => (ls || []).reduce((a, l) => a + (+l.precio || 0) * (+l.cant || 0), 0);
const sinPrecio = ls => (ls || []).some(l => l.precio == null || l.precio === '');
/* Utilidad = venta − costo de refacciones y productos. La mano de obra no tiene costo de inventario. */
function utilidad(ls){
  let venta = 0, cst = 0, faltan = 0;
  for (const l of ls || []){
    if (l.precio == null || l.precio === '') { faltan++; continue; }
    venta += (+l.precio || 0) * (+l.cant || 0);
    const ref = l.equipoId || l.productoId;
    if (ref){ const c = costo(ref); if (c == null) faltan++; else cst += c * (+l.cant || 0); }
  }
  return venta ? { venta, util:venta - cst, pct:(venta - cst) / venta * 100, faltan } : { faltan, venta:0 };
}
function bajoMargen(ls){ const u = utilidad(ls); return u.pct != null && !u.faltan ? u.pct < cfg().margenMinimo : null; }

/* ---------- inventario (regla 5) ---------- */
function ex(pid){ const e = S.existencias[pid] || {}; return { disp:+e.disp || 0, apart:+e.apart || 0, min:e.min == null ? null : +e.min }; }
function setEx(pid, e){ put('existencias', pid, Object.assign({}, S.existencias[pid] || {}, e)); }
const prodNombre = pid => (S.productos[pid] && S.productos[pid].nombre) || 'Producto sin registro';
const lineasInventario = o => (o.lineas || []).filter(l => l.productoId && S.productos[l.productoId]);
/* Al autorizar se apartan las refacciones; regresa cuántas piezas faltan. */
function apartarOrden(o){
  let falt = 0;
  lineasInventario(o).forEach(l => {
    const need = (+l.cant || 0) - (+l.apartado || 0); if (need <= 0) return;
    const e = ex(l.productoId), take = Math.min(need, e.disp);
    if (take > 0){ setEx(l.productoId, { disp:e.disp - take, apart:e.apart + take }); logMov({ tipo:'apartado', productoId:l.productoId, cant:take, ref:o.folio, motivo:'Presupuesto autorizado' }); }
    l.apartado = (+l.apartado || 0) + take; falt += need - take;
  });
  return falt;
}
function liberarOrden(o, motivo){
  lineasInventario(o).forEach(l => {
    const a = +l.apartado || 0; if (!a) return;
    const e = ex(l.productoId); setEx(l.productoId, { disp:e.disp + a, apart:Math.max(0, e.apart - a) });
    l.apartado = 0; logMov({ tipo:'liberado', productoId:l.productoId, cant:a, ref:o.folio, motivo:motivo || 'Orden sin reparar' });
  });
}
/* Al terminar la reparación se descuentan; si el sistema no tiene la pieza, primero se registra su entrada. */
function descontarOrden(o){
  const faltan = [];
  lineasInventario(o).forEach(l => { const e = ex(l.productoId), need = +l.cant || 0, ap = Math.min(+l.apartado || 0, e.apart); if (ap + e.disp < need) faltan.push(prodNombre(l.productoId)); });
  if (faltan.length) return 'No hay existencia registrada de: ' + faltan.join(', ') + '. Registra su entrada en Inventario antes de terminar.';
  lineasInventario(o).forEach(l => {
    const e = ex(l.productoId), need = +l.cant || 0, ap = Math.min(+l.apartado || 0, e.apart, need);
    setEx(l.productoId, { apart:e.apart - ap, disp:e.disp - (need - ap) });
    l.apartado = 0; l.instalado = need;
    logMov({ tipo:'instalado', productoId:l.productoId, cant:need, ref:o.folio, motivo:'Reparación terminada' });
  });
  return null;
}

/* ---------- órdenes de servicio ---------- */
const totalOrden = o => montoLineas(o.lineas);
const pagadoOrden = o => (o.pagos || []).reduce((a, p) => a + (+p.monto || 0), 0);
const saldoOrden = o => Math.max(0, totalOrden(o) - pagadoOrden(o));
const ordenAbierta = o => o.estado !== 'entregado';
const equipoTxt = e => e ? nombreModelo(e.modeloId, (e.marca ? e.marca + ' ' : '') + (e.modelo || '')) : 'Equipo';
function hist(o, nota, publico){ o.historial = (o.historial || []).concat([{ fecha:hoyISO(), hora:ahoraHM(), autor:quien(), nota, publico:!!publico }]); }
function crearOrden(data){
  const id = uid('os');
  const o = Object.assign({ folio:nuevoFolio('OS'), clienteId:null, citaId:null, origen:'mostrador', modalidad:'cafeteria', equipo:{}, problema:'diagnostico', falla:'', recepcion:{}, diagnostico:'', lineas:[], autorizacion:{ estado:'pendiente' }, estado:'recibido', tecnico:'', promesa:null, pagos:[], historial:[], creada:hoyISO(), actualizada:hoyISO() }, data);
  hist(o, 'Equipo recibido en ' + (o.modalidad === 'domicilio' ? 'recolección a domicilio' : empresa().lugar), true);
  put('ordenes', id, o);
  if (o.clienteId) bitacora(o.clienteId, { tipo:'Orden de servicio', nota:'Recibimos ' + equipoTxt(o.equipo) + ' · ' + (PROB[o.problema] ? PROB[o.problema].t : o.problema) + ' · ' + o.folio });
  return { id, o };
}
function ordenEdit(id, fn){ const o = clone(S.ordenes[id]); if (!o) return false; if (fn(o) === false) return false; o.actualizada = hoyISO(); put('ordenes', id, o); return true; }
/* Regla 3: sin autorización no se repara. Queda quién, cuándo y por qué medio. */
function autorizar(o, decision, medio, motivo, autor){
  if (decision === 'si'){
    o.autorizacion = { estado:'autorizado', medio, fecha:hoyISO(), hora:ahoraHM(), por:autor || quien(), monto:totalOrden(o) };
    const falt = apartarOrden(o);
    o.estado = falt ? 'espera' : 'autorizado';
    hist(o, 'Presupuesto autorizado (' + (MEDIOS[medio] || medio) + ') por ' + fmtMoney(totalOrden(o)) + (falt ? ' · esperando ' + falt + ' refacción(es)' : ''), true);
  } else {
    o.autorizacion = { estado:'rechazado', medio, fecha:hoyISO(), hora:ahoraHM(), por:autor || quien(), motivo };
    liberarOrden(o, 'Presupuesto no autorizado');
    o.estado = 'rechazado';
    hist(o, 'Presupuesto no autorizado · ' + (RECHAZOS[motivo] || motivo || 'sin motivo') + ' · el equipo se devuelve', true);
  }
}
/* Regla 6: entregar cobra el saldo, fija la garantía, registra el equipo y borra el código de desbloqueo. */
function entregar(id, d){
  let err = null, oFinal = null;
  ordenEdit(id, o => {
    const reparado = o.estado === 'listo';
    if (!reparado && o.estado !== 'rechazado'){ err = 'Solo se entrega un equipo listo o uno que no se autorizó reparar.'; return false; }
    if (d.pago && +d.pago.monto > 0) o.pagos = (o.pagos || []).concat([{ fecha:hoyISO(), hora:ahoraHM(), monto:+d.pago.monto, forma:d.pago.forma, concepto:'Liquidación', por:quien() }]);
    if (reparado && saldoOrden(o) > 0){ err = 'Falta cobrar ' + fmtMoney(saldoOrden(o)) + ' antes de entregar.'; return false; }
    if (reparado && !(+d.garantiaDias > 0)){ err = 'Escribe los días de garantía de esta reparación.'; return false; }
    if (!(d.recibio || '').trim()){ err = 'Escribe quién recibe el equipo.'; return false; }
    const hasta = reparado ? sumarDias(hoyISO(), +d.garantiaDias) : null;
    o.entrega = { fecha:hoyISO(), hora:ahoraHM(), por:quien(), recibio:d.recibio.trim(), pruebas:d.pruebas || {}, reparado, garantiaDias:reparado ? +d.garantiaDias : 0, garantiaHasta:hasta };
    o.equipo = Object.assign({}, o.equipo, { acceso:'', accesoBorrado:!!(o.equipo && o.equipo.acceso) });
    o.estado = 'entregado';
    hist(o, reparado ? 'Equipo entregado a ' + d.recibio.trim() + ' · garantía hasta ' + fmtD(hasta) : 'Equipo devuelto sin reparar a ' + d.recibio.trim(), true);
    oFinal = o;
  });
  if (err) return err;
  if (oFinal.clienteId){
    if (oFinal.entrega.reparado) registrarDispositivo(oFinal.clienteId, { marca:oFinal.equipo.marca, modelo:oFinal.equipo.modelo, modeloId:oFinal.equipo.modeloId, imei:oFinal.equipo.imei, color:oFinal.equipo.color, origen:'Reparación', ref:oFinal.folio, garantiaHasta:oFinal.entrega.garantiaHasta });
    bitacora(oFinal.clienteId, { tipo:'Entrega', nota:(oFinal.entrega.reparado ? 'Entregado reparado · garantía hasta ' + fmtD(oFinal.entrega.garantiaHasta) : 'Devuelto sin reparar') + ' · ' + oFinal.folio });
  }
  return null;
}
function reclamoGarantia(id, nota){
  const o = S.ordenes[id]; if (!o) return null;
  const r = crearOrden({ clienteId:o.clienteId, equipo:Object.assign({}, o.equipo, { acceso:'' }), problema:o.problema, falla:'Reclamo de garantía de ' + o.folio + ': ' + (nota || ''), garantiaDe:id, origen:'garantia', recepcion:{ checklist:{}, accesorios:[], aceptaTerminos:true } });
  ordenEdit(r.id, x => { hist(x, 'Reclamo de garantía de la orden ' + o.folio, true); });
  return r;
}

/* ---------- garantías ---------- */
function garantias(){
  const out = [], hoy = hoyISO();
  ents(S.ordenes).forEach(([id, o]) => { if (o.entrega && o.entrega.garantiaHasta) out.push({ tipo:'Reparación', id, folio:o.folio, clienteId:o.clienteId, equipo:equipoTxt(o.equipo), imei:o.equipo.imei, desde:o.entrega.fecha, hasta:o.entrega.garantiaHasta, dias:difDias(o.entrega.garantiaHasta, hoy), problema:o.problema, reclamos:vals(S.ordenes).filter(x => x.garantiaDe === id) }); });
  ents(S.ventas).forEach(([id, v]) => (v.lineas || []).forEach(l => { if (l.garantiaHasta) out.push({ tipo:l.equipoId ? 'Equipo vendido' : 'Accesorio', id, folio:v.folio, clienteId:v.clienteId, equipo:l.desc, imei:l.imei || '', desde:v.fecha, hasta:l.garantiaHasta, dias:difDias(l.garantiaHasta, hoy), reclamos:[] }); }));
  return out.sort((a, b) => a.dias - b.dias);
}

/* ---------- ventas, compras y caja ---------- */
function registrarVenta(d){
  const lineas = d.lineas || [];
  if (!lineas.length) return { err:'Agrega al menos un producto.' };
  if (sinPrecio(lineas)) return { err:'Hay productos sin precio. Escribe el precio antes de cobrar.' };
  for (const l of lineas){
    if (l.productoId && ex(l.productoId).disp < (+l.cant || 0)) return { err:'No hay existencia suficiente de ' + prodNombre(l.productoId) + '.' };
    if (l.equipoId && (S.equipos[l.equipoId] || {}).estado !== 'disponible' && (S.equipos[l.equipoId] || {}).estado !== 'apartado') return { err:'Ese celular ya no está disponible.' };
  }
  const credito = d.tomaId ? +(S.compras[d.tomaId] || {}).precio || 0 : 0;
  const total = montoLineas(lineas), cobrar = Math.max(0, total - credito);
  const pagado = (d.pagos || []).reduce((a, p) => a + (+p.monto || 0), 0);
  if (pagado < cobrar) return { err:'Falta cobrar ' + fmtMoney(cobrar - pagado) + '.' };
  const id = uid('vt'), folio = nuevoFolio('V'), hoy = hoyISO();
  const ls = lineas.map(l => {
    const x = Object.assign({}, l);
    if (l.equipoId){ const q = S.equipos[l.equipoId]; const g = cfg().garantiaEquipo[q.condicion === 'nuevo' ? 'nuevo' : 'seminuevo']; const dias = l.garantiaDias != null && l.garantiaDias !== '' ? +l.garantiaDias : g; x.imei = q.imei; x.garantiaDias = dias; x.garantiaHasta = dias ? sumarDias(hoy, dias) : null; }
    return x;
  });
  const v = { folio, fecha:hoy, hora:ahoraHM(), clienteId:d.clienteId || null, lineas:ls, total, tomaId:d.tomaId || null, credito, pagos:(d.pagos || []).filter(p => +p.monto > 0).map(p => ({ forma:p.forma, monto:+p.monto, fecha:hoy })), cambio:Math.max(0, pagado - cobrar), vendedor:quien(), citaId:d.citaId || null };
  put('ventas', id, v);
  ls.forEach(l => {
    if (l.productoId){ const e = ex(l.productoId); setEx(l.productoId, { disp:e.disp - (+l.cant || 0) }); logMov({ tipo:'venta', productoId:l.productoId, cant:+l.cant, ref:folio, motivo:'Venta' }); }
    if (l.equipoId){
      const q = clone(S.equipos[l.equipoId]); q.estado = 'vendido'; q.ventaId = id; q.vendido = hoy; put('equipos', l.equipoId, q);
      if (v.clienteId) registrarDispositivo(v.clienteId, { marca:q.marca, modelo:q.modelo, modeloId:q.modeloId, imei:q.imei, color:q.color, origen:'Compra en tienda', ref:folio, garantiaHasta:l.garantiaHasta });
    }
  });
  if (d.tomaId){ const c = clone(S.compras[d.tomaId]); c.aplicadaEn = folio; put('compras', d.tomaId, c); }
  if (v.clienteId) bitacora(v.clienteId, { tipo:'Compra', nota:'Venta ' + folio + ' por ' + fmtMoney(total) + (credito ? ' (toma a cuenta ' + fmtMoney(credito) + ')' : '') });
  return { id, v };
}
/* Regla 7: sin identificación, IMEI sin reporte y cuentas desvinculadas no se compra ni se toma a cuenta. */
const VERIFICACIONES = [['identificacion','Identificación oficial del vendedor revisada'],['imei','IMEI consultado: sin reporte de robo o extravío'],['cuentas','Cuentas desvinculadas (iCloud / Google) y equipo restablecido'],['propiedad','Comprobante de propiedad o carta responsiva firmada']];
function compraVerificada(c){ return VERIFICACIONES.every(([k]) => c.verificacion && c.verificacion[k]); }
function aceptarCompra(id, d){
  const c = clone(S.compras[id]); if (!c) return 'No se encontró la evaluación.';
  if (!compraVerificada(c)) return 'Faltan verificaciones. Sin ellas no se compra ni se toma a cuenta.';
  if (!(+d.precio > 0)) return 'Escribe el precio acordado.';
  if (!c.equipo.imei) return 'Captura el IMEI del equipo.';
  const eqId = uid('eq');
  put('equipos', eqId, { marca:c.equipo.marca, modelo:c.equipo.modelo, modeloId:c.equipo.modeloId, capacidad:c.equipo.capacidad, color:c.equipo.color, condicion:'seminuevo', bateria:c.equipo.bateria || null, imei:c.equipo.imei, precio:null, estado:'reacondicionar', origen:c.tipo === 'toma' ? 'Toma a cuenta' : 'Compra a cliente', compraId:id, alta:hoyISO() });
  /* Con Supabase, mostrador no puede escribir costos: la base los registra al aceptar la compra. */
  if (verCostos() || Store.mode !== 'supabase') put('costos', eqId, { costo:+d.precio });
  c.estado = 'aceptada'; c.precio = +d.precio; c.equipoId = eqId; c.cerrada = hoyISO();
  if (c.tipo === 'compra') c.pago = { fecha:hoyISO(), hora:ahoraHM(), forma:d.forma || 'efectivo', monto:+d.precio, por:quien() };
  put('compras', id, c);
  return null;
}
/* Caja del día: lo que entró por reparaciones y ventas, y lo que salió por compras de equipos. */
function caja(fecha){
  const out = [];
  ents(S.ordenes).forEach(([id, o]) => (o.pagos || []).forEach(p => { if (p.fecha === fecha) out.push({ hora:p.hora || '', concepto:(p.concepto || 'Pago') + ' · ' + o.folio, forma:p.forma, monto:+p.monto, kind:'orden', id }); }));
  ents(S.ventas).forEach(([id, v]) => (v.pagos || []).forEach(p => { if ((p.fecha || v.fecha) === fecha) out.push({ hora:v.hora || '', concepto:'Venta · ' + v.folio, forma:p.forma, monto:+p.monto - (p.forma === 'efectivo' ? +v.cambio || 0 : 0), kind:'venta', id }); }));
  ents(S.compras).forEach(([id, c]) => { if (c.pago && c.pago.fecha === fecha) out.push({ hora:c.pago.hora || '', concepto:'Compra de equipo · ' + c.folio, forma:c.pago.forma, monto:-c.pago.monto, kind:'compra', id }); });
  return out.sort((a, b) => a.hora.localeCompare(b.hora));
}

/* ---------- lo que se consulta desde afuera (sitio y portal) ----------
   En Supabase pasan por funciones de la base que validan folio y celular;
   en modo local se resuelven aquí con la misma forma de respuesta. */
function vistaOrden(o){
  const pres = ['presupuesto','autorizado','reparacion','espera','listo','entregado','rechazado'].includes(o.estado);
  return { tipo:'orden', folio:o.folio, estado:o.estado, equipo:equipoTxt(o.equipo), problema:o.problema, creada:o.creada, promesa:o.promesa, modalidad:o.modalidad,
    lineas:pres ? (o.lineas || []).map(l => ({ desc:l.desc, cant:+l.cant || 1, precio:l.precio })) : [], total:pres ? totalOrden(o) : null, pagado:pagadoOrden(o),
    autorizacion:o.autorizacion || {}, garantiaHasta:o.entrega ? o.entrega.garantiaHasta : null, diagnostico:pres ? o.diagnostico || '' : '',
    historial:(o.historial || []).filter(h => h.publico).map(h => ({ fecha:h.fecha, hora:h.hora, nota:h.nota })) };
}
function vistaCita(c){
  const ord = c.ordenId && S.ordenes[c.ordenId];
  return { tipo:'cita', folio:c.folio, estado:c.estado, fecha:c.fecha, hora:c.hora, turno:c.turno, lugar:c.lugar, motivo:c.motivo, modalidad:c.modalidad, cotizacion:c.cotizacion, nombre:(c.contacto.nombre || '').split(' ')[0], orden:ord ? ord.folio : null };
}
/* Lo que el cliente ve de su cuenta en el portal: nunca notas internas, costos ni códigos. */
function vistaCuenta(cid){
  const c = S.clientes[cid]; if (!c) return null;
  const porFecha = (a, b) => (b.creada || b.fecha || '').localeCompare(a.creada || a.fecha || '');
  return { cliente:{ nombre:c.nombre, tel:c.tel, correo:c.correo || '', dispositivos:(c.dispositivos || []).map(d => ({ marca:d.marca, modelo:d.modelo, imei:d.imei, color:d.color, origen:d.origen, ref:d.ref, garantiaHasta:d.garantiaHasta || null })) },
    ordenes:vals(S.ordenes).filter(o => o.clienteId === cid).map(vistaOrden).sort(porFecha),
    citas:vals(S.citas).filter(x => x.clienteId === cid).map(vistaCita).sort(porFecha),

function vCelulares(){
  const f = U.celCond || '';
  const qs = T.ents(S.equipos).filter(([, q]) => q.estado === 'disponible' && (!f || q.condicion === f)).sort((a, b) => (+a[1].precio || 0) - (+b[1].precio || 0));
  const g = T.cfg().garantiaEquipo;
  return '<main class="sitio"><section class="seccion"><div class="eyebrow">Celulares</div><h1>Nuevos y seminuevos de todas las gamas</h1><p class="muted">Todos se revisan antes de venderse y se entregan con garantía. ¿Tienes un celular que ya no usas? Te lo tomamos a cuenta.</p>'
    + '<div class="filtros"><button type="button" class="filtro" data-act="cel" data-v=""' + sel(!f) + '>Todos</button><button type="button" class="filtro" data-act="cel" data-v="nuevo"' + sel(f === 'nuevo') + '>Nuevos</button><button type="button" class="filtro" data-act="cel" data-v="seminuevo"' + sel(f === 'seminuevo') + '>Seminuevos</button></div>'
    + (qs.length ? '<div class="productos">' + qs.map(([id, q]) => { const m = S.modelos[q.modeloId]; const gd = g[q.condicion === 'nuevo' ? 'nuevo' : 'seminuevo'];
        return '<article class="producto">' + '<div class="row">' + chip(q.condicion === 'nuevo' ? 'info' : 'ok', q.condicion === 'nuevo' ? 'Nuevo' : 'Seminuevo') + (m ? '<span class="small muted">' + esc(T.GAMAS[m.gama] || '') + '</span>' : '') + '</div><h3>' + esc(q.marca + ' ' + q.modelo) + '</h3>'
          + '<p class="small muted">' + [q.capacidad, q.color, q.bateria ? 'batería al ' + q.bateria + '%' : ''].filter(Boolean).map(esc).join(' · ') + '</p>'
          + '<p class="precio">' + T.precioTxt(q.precio) + (q.demo ? ' ' + T.DEMO_TAG : '') + '</p><p class="small">' + (gd ? gd + ' días de garantía' : 'Garantía ' + PC) + '</p>'
          + '<button class="btn sm" type="button" data-act="apartar" data-e="' + esc(id) + '">Apartar y verlo en mi turno</button></article>'; }).join('') + '</div>'
      : '<div class="card"><h3>Pronto publicamos los equipos disponibles</h3><p class="muted">Agenda un turno y te mostramos lo que tenemos.</p><div><button class="btn primary" type="button" data-act="flujo-cita" data-v="compra">Agendar un turno</button></div></div>')
    + '</section></main>';
}
function vVender(){
  const w = U.w, enFlujo = w.flujo === 'vender';
  return '<main class="sitio"><section class="seccion"><div class="eyebrow">Vende o cambia tu celular</div><h1>Tu celular de antes vale</h1><p class="muted">Te lo compramos o lo tomamos a cuenta de un celular o accesorios. Por seguridad, solo recibimos equipos propios y sin reporte.</p></section>'
    + (enFlujo ? asistente() : '<div class="grid2"><div class="card">' + requisitosVenta() + '</div><div class="card"><h3>¿Cómo funciona?</h3><ol class="lista"><li>Elige tu marca y tu modelo.</li><li>Cuéntanos cómo está.</li><li>Agenda tu cita: revisamos el equipo contigo y te hacemos una oferta.</li></ol><div><button class="btn primary lg" type="button" data-act="flujo-vender">Empezar</button></div></div></div>')
    + '</main>';
}
function vDomicilio(){
  const c = T.cfg().domicilio;
  return '<main class="sitio"><section class="seccion"><div class="eyebrow">A domicilio</div><h1>Recolección y entrega a domicilio</h1><p class="muted">Si no puedes venir, pasamos por tu celular y te lo regresamos reparado.</p>'
    + '<dl class="kv"><dt>Disponible</dt><dd>' + (c.activo ? 'Sí' : PC) + '</dd><dt>Costo</dt><dd>' + (c.costo != null ? T.fmtMoney(c.costo) : PC) + '</dd><dt>Zona</dt><dd>' + (c.zona ? esc(c.zona) : PC) + '</dd></dl>'
    + '<div class="row"><button class="btn primary lg" type="button" data-act="flujo-domicilio">Cotizar y pedir recolección</button></div>'
    + '<p class="small muted">Primero cotizas como siempre; en el paso de la cita eliges “Recójanlo en mi domicilio”.</p></section></main>';
}
function vGarantia(){
  const c = T.cfg();
  return '<main class="sitio"><section class="seccion"><div class="eyebrow">Garantía</div><h1>Toda reparación se entrega con garantía</h1><p class="muted">Al entregarte tu equipo te damos un comprobante con la fecha hasta la que cubre la garantía. Con tu folio la consultas cuando quieras.</p>'
    + '<div class="tbl"><table class="t"><thead><tr><th>Servicio</th><th class="num">Garantía</th></tr></thead><tbody>' + T.PROBLEMAS.filter(p => p.id !== 'diagnostico').map(p => '<tr><td>' + esc(p.t) + '</td><td class="num">' + (c.garantias[p.id] ? c.garantias[p.id] + ' días' : PC) + '</td></tr>').join('')
    + '<tr><td>Celulares nuevos</td><td class="num">' + (c.garantiaEquipo.nuevo ? c.garantiaEquipo.nuevo + ' días' : PC) + '</td></tr><tr><td>Celulares seminuevos</td><td class="num">' + (c.garantiaEquipo.seminuevo ? c.garantiaEquipo.seminuevo + ' días' : PC) + '</td></tr></tbody></table></div>'
    + '<div class="grid2"><div class="card"><h3>Qué cubre</h3><p>' + (c.terminos.garantia ? esc(c.terminos.garantia) : 'Las condiciones de la garantía están ' + PC + '.') + '</p></div>'
    + '<div class="card"><h3>¿Algo falló?</h3><p>Agenda un turno con el motivo “Garantía” y trae tu folio.</p><div class="row"><button class="btn primary" type="button" data-act="flujo-cita" data-v="garantia">Agendar por garantía</button><button class="btn" type="button" data-act="sv" data-v="consulta">Consultar mi garantía</button></div></div></div></section></main>';
}

/* ---------- consulta por folio y celular ---------- */
const lineaTiempo = T.lineaTiempo;
function vResultado(){
  const q = U.q, r = q.res; if (!r) return '';
  if (r.tipo === 'cita'){
    const e = T.estadoDe(T.ESTADOS_CITA, r.estado);
    return '<article class="card"><div class="row"><h3>Cita <span class="mono">' + esc(r.folio) + '</span></h3><span class="spacer"></span>' + chip(e[2], e[1]) + '</div>'
      + '<dl class="kv"><dt>Turno</dt><dd><b>' + esc(r.turno) + '</b></dd><dt>Cuándo</dt><dd>' + esc(T.fmtDia(r.fecha)) + ' · ' + esc(r.hora) + '</dd><dt>Dónde</dt><dd>' + esc(r.modalidad === 'domicilio' ? 'En tu domicilio' : r.lugar) + '</dd><dt>Motivo</dt><dd>' + esc(T.MOTIVOS_CITA[r.motivo] || r.motivo) + '</dd>'
      + (r.cotizacion && r.cotizacion.problema ? '<dt>Cotización</dt><dd>' + esc(T.PROB[r.cotizacion.problema] ? T.PROB[r.cotizacion.problema].t : '') + ' · ' + esc(r.cotizacion.equipo || '') + '</dd>' : '') + '</dl>'
      + (r.orden ? '<p class="callout info"><strong>Tu equipo quedó registrado</strong>Su orden es <span class="mono">' + esc(r.orden) + '</span>. <button class="linkbtn" type="button" data-act="q-orden" data-v="' + esc(r.orden) + '">Ver cómo va</button></p>' : '')
      + (r.estado === 'agendada' ? (q.cancelando ? '<div class="stack tight"><label class="f" for="q-mot">¿Por qué cancelas?<select id="q-mot" data-bind="q.motivo"><option value="cliente">Ya no la necesito</option><option value="reprogramo">Voy a agendar otro día</option><option value="otro">Otro motivo</option></select></label><div class="row"><button class="btn danger" type="button" data-act="q-cancelar-ok">Cancelar mi cita</button><button class="btn quiet" type="button" data-act="q-cancelar">No, conservarla</button></div></div>' : '<div><button class="btn" type="button" data-act="q-cancelar">Cancelar esta cita</button></div>') : '')
      + '</article>';
  }
  const e = T.estadoDe(T.ESTADOS_ORDEN, r.estado);
  const saldo = r.total != null ? Math.max(0, r.total - (r.pagado || 0)) : null;
  return '<article class="card"><div class="row"><h3>Orden <span class="mono">' + esc(r.folio) + '</span></h3><span class="spacer"></span>' + chip(e[2], e[1]) + '</div>'
    + '<p class="muted">' + esc(r.equipo) + ' · ' + esc(T.PROB[r.problema] ? T.PROB[r.problema].t : '') + '</p>'
    + '<div class="grid2"><div>' + lineaTiempo(r) + '</div><div class="stack tight">'
    + (r.diagnostico ? '<div><h4>Diagnóstico</h4><p>' + esc(r.diagnostico) + '</p></div>' : '')
    + (r.lineas.length ? '<div class="tbl"><table class="t"><thead><tr><th>Concepto</th><th class="num">Importe</th></tr></thead><tbody>' + r.lineas.map(l => '<tr><td>' + esc(l.desc) + (l.cant > 1 ? ' × ' + l.cant : '') + '</td><td class="num">' + T.precioTxt(l.precio == null ? null : l.precio * l.cant) + '</td></tr>').join('') + '</tbody><tfoot><tr><td>Total</td><td class="num">' + T.fmtMoney(r.total) + '</td></tr>' + (r.pagado ? '<tr><td>Pagado</td><td class="num">' + T.fmtMoney(r.pagado) + '</td></tr><tr><td>Saldo</td><td class="num">' + T.fmtMoney(saldo) + '</td></tr>' : '') + '</tfoot></table></div>' : '')
    + (r.estado === 'presupuesto' ? (q.rechazando
        ? '<div class="stack tight"><label class="f" for="q-rech">¿Por qué no lo autorizas?<select id="q-rech" data-bind="q.motivo">' + T.ents(T.RECHAZOS).map(([k, v]) => '<option value="' + k + '"' + (q.motivo === k ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></label><div class="row"><button class="btn danger" type="button" data-act="q-autorizar" data-v="no">No autorizo</button><button class="btn quiet" type="button" data-act="q-rechazar">Volver</button></div></div>'
        : '<div class="callout spot"><strong>Necesitamos tu autorización</strong>No reparamos nada sin tu visto bueno.</div><div class="row"><button class="btn primary" type="button" data-act="q-autorizar" data-v="si">Autorizo la reparación</button><button class="btn" type="button" data-act="q-rechazar">No autorizo</button></div>') : '')
    + (r.garantiaHasta ? '<p class="callout info"><strong>Garantía</strong>Vigente hasta el ' + esc(T.fmtD(r.garantiaHasta)) + '.</p>' : '')
    + '</div></div>'
    + (r.historial.length ? '<details><summary>Historial</summary><ul class="log">' + r.historial.slice().reverse().map(h => '<li><span class="h">' + esc(T.fmtD(h.fecha)) + (h.hora ? ' · ' + esc(h.hora) : '') + '</span>' + esc(h.nota) + '</li>').join('') + '</ul></details>' : '')
    + '</article>';
}
function vConsulta(){
  const q = U.q;
  return '<main class="sitio"><section class="seccion consulta"><div class="eyebrow">Mi cita y mi equipo</div><h1>Consulta tu cita o tu reparación</h1><p class="muted">Escribe el folio que te dimos (empieza con CT si es una cita u OS si es una orden) y tu celular.</p>'
    + '<form class="panel consulta-f" data-form="consultar"><label class="f" for="q-folio">Folio<input id="q-folio" data-bind="q.folio" value="' + esc(q.folio) + '" placeholder="CT-… u OS-…" autocapitalize="characters" autocomplete="off"></label>'
    + '<label class="f" for="q-tel">Celular<input id="q-tel" type="tel" inputmode="numeric" data-bind="q.tel" value="' + esc(q.tel) + '" placeholder="10 dígitos"></label>'
    + '<button class="btn primary" type="submit"' + (q.buscando ? ' disabled' : '') + '>' + (q.buscando ? 'Buscando…' : 'Consultar') + '</button></form>'
    + (q.err ? '<p class="err" role="alert">' + esc(q.err) + '</p>' : '') + vResultado() + '</section></main>';
}

function vista(){
  const v = { inicio:vInicio, accesorios:vAccesorios, celulares:vCelulares, vender:vVender, domicilio:vDomicilio, garantia:vGarantia, consulta:vConsulta }[U.sv] || vInicio;
  return barra() + v() + pie();
}
function despues(){
  if (U.wScroll){ U.wScroll = false; const el = document.getElementById('asistente'); if (el && el.getBoundingClientRect().top < 0) el.scrollIntoView({ block:'start' }); }
}
function nuevoAsistente(flujo, extra){ U.w = Object.assign(T.clone(W0), { flujo, paso:FLUJOS[flujo][0] }, extra || {}); }
async function buscar(){
  const q = U.q;
  if (!q.folio.trim() || T.digitos(q.tel).length !== 10){ q.err = 'Escribe tu folio y tu celular de 10 dígitos.'; return T.scheduleRender(); }
  q.buscando = true; q.err = ''; q.res = null; T.scheduleRender();
  try { q.res = await T.consultar(q.folio, q.tel); if (!q.res) q.err = 'No encontramos ese folio con ese celular. Revisa que estén bien escritos.'; }
  catch (e) { q.err = 'No se pudo consultar: ' + e.message; }
  q.buscando = false; q.rechazando = false; q.cancelando = false; T.scheduleRender();
}

T.registrar('sitio', {
  barra, vista, despues, acceso:'publico',
  estado:{ sv:'inicio', w:T.clone(W0), q:{ folio:'', tel:'', res:null, err:'', buscando:false, motivo:'precio', rechazando:false, cancelando:false }, cat:'', celCond:'', wScroll:false },
  alEntrar(){
    const p = new URLSearchParams(location.search);
    if (p.get('folio')){ U.sv = 'consulta'; U.q.folio = p.get('folio').toUpperCase(); }
  },
  acciones:{
    sv(d){ U.sv = d.v; if (d.v === 'inicio' && U.w.flujo !== 'reparar') nuevoAsistente('reparar'); T.scheduleRender(); window.scrollTo(0, 0); },
    cat(d){ U.cat = d.v; T.scheduleRender(); },
    cel(d){ U.celCond = d.v; T.scheduleRender(); },
    'w-ir'(d){ ir(d.v); },
    'w-atras'(){ const p = FLUJOS[U.w.flujo], i = p.indexOf(U.w.paso); if (i > 0) ir(p[i - 1]); },
    'w-problema'(d){ U.w.problema = d.v; ir('marca'); },
    'w-marca'(d){ const w = U.w; if (w.marca !== d.v){ w.modeloId = ''; w.modeloTexto = ''; w.busca = ''; } w.marca = d.v; w.sinModelo = d.v === 'Otra'; ir('modelo'); },
    'w-modelo'(d){ const w = U.w; w.modeloId = d.v; w.modeloTexto = ''; w.opcion = ''; ir(w.flujo === 'vender' ? 'estado' : 'cotizacion'); },
    'w-sin-modelo'(){ U.w.sinModelo = !U.w.sinModelo; U.w.modeloId = ''; T.scheduleRender(); },
    'w-motivo'(d){ U.w.motivo = d.v; ir('cita'); },
    'w-dia'(d){ U.w.fecha = d.v; U.w.hora = ''; T.scheduleRender(); },
    'w-hora'(d){ U.w.hora = d.v; U.w.err = ''; T.scheduleRender(); },
    'w-estado-ok'(){ const w = U.w; if (!w.condicion){ w.err = 'Elige cómo está tu equipo.'; return T.scheduleRender(); } ir('cita'); },
    'w-nuevo'(){ nuevoAsistente('reparar'); U.sv = 'inicio'; T.scheduleRender(); window.scrollTo(0, 0); },
    'flujo-vender'(){ nuevoAsistente('vender'); U.sv = 'vender'; T.scheduleRender(); },
    'flujo-cita'(d){ nuevoAsistente('cita', { motivo:d.v, paso:'cita' }); U.sv = 'inicio'; T.scheduleRender(); window.scrollTo(0, 0); },
    'flujo-domicilio'(){ nuevoAsistente('reparar', { modalidad:'domicilio' }); U.sv = 'inicio'; T.scheduleRender(); window.scrollTo(0, 0); },
    apartar(d){ nuevoAsistente('cita', { motivo:'compra', paso:'cita', productoId:d.p || '', equipoId:d.e || '' }); U.sv = 'inicio'; T.scheduleRender(); window.scrollTo(0, 0); },
    'ver-cita'(){ const h = U.w.hecho; U.q.folio = h.folio; U.q.tel = U.w.tel; U.sv = 'consulta'; buscar(); window.scrollTo(0, 0); },
    'q-orden'(d){ U.q.folio = d.v; buscar(); },
    'q-rechazar'(){ U.q.rechazando = !U.q.rechazando; T.scheduleRender(); },
    'q-cancelar'(){ U.q.cancelando = !U.q.cancelando; U.q.motivo = 'cliente'; T.scheduleRender(); },
    async 'q-autorizar'(d){
      const q = U.q;
      try { q.res = await T.autorizarFuera(q.folio, q.tel, d.v, d.v === 'no' ? q.motivo : '', 'sitio'); q.rechazando = false; T.toast(d.v === 'si' ? 'Gracias. Autorizaste la reparación; te avisamos cuando esté lista.' : 'Listo. Registramos que no autorizas; tu equipo se devuelve sin reparar.'); }
      catch (e) { T.toast(e.message, 'crit'); }
      T.scheduleRender();
    },
    async 'q-cancelar-ok'(){
      const q = U.q;
      try { q.res = await T.cancelarFuera(q.folio, q.tel, q.motivo); q.cancelando = false; T.toast('Cancelamos tu cita.'); await T.cargarOcupacion(); }
      catch (e) { T.toast(e.message, 'crit'); }
      T.scheduleRender();
    }
  },
  formularios:{
    consultar:buscar,
    'w-modelo-texto'(){
      const w = U.w;
      if (w.marca === 'Otra' && !w.marcaTexto.trim()){ T.toast('Escribe la marca de tu celular.', 'warn'); return; }
      if (!w.modeloTexto.trim()){ T.toast('Escribe el modelo de tu celular.', 'warn'); return; }
      w.modeloId = ''; ir(w.flujo === 'vender' ? 'estado' : 'cotizacion');
    },
    async 'w-agendar'(){
      const w = U.w;
      if (!w.fecha || !w.hora){ w.err = 'Elige el día y la hora de tu cita.'; return T.scheduleRender(); }
      if (w.nombre.trim().length < 2){ w.err = 'Escribe tu nombre.'; return T.scheduleRender(); }
      if (T.digitos(w.tel).length !== 10){ w.err = 'Escribe tu celular a 10 dígitos para avisarte por WhatsApp.'; return T.scheduleRender(); }
      if (w.modalidad === 'domicilio' && w.direccion.trim().length < 8){ w.err = 'Escribe tu dirección completa para la recolección.'; return T.scheduleRender(); }
      if (!w.privacidad){ w.err = 'Necesitamos tu permiso para usar tus datos en tu cita.'; return T.scheduleRender(); }
      const motivo = w.flujo === 'reparar' ? 'reparacion' : w.flujo === 'vender' ? 'venta' : w.motivo;
      const cot = w.flujo === 'cita' ? (w.productoId || w.equipoId ? { tipo:'compra', productoId:w.productoId || null, equipoId:w.equipoId || null, equipo:w.productoId ? T.prodNombre(w.productoId) : equipoVenta(S.equipos[w.equipoId]) } : w.ordenFolio ? { tipo:'entrega', ordenFolio:w.ordenFolio.trim().toUpperCase() } : null)
        : { tipo:w.flujo === 'vender' ? 'venta' : 'reparacion', problema:w.problema || null, modeloId:w.modeloId || null, marca:w.marca === 'Otra' ? w.marcaTexto.trim() : w.marca, modeloTexto:w.modeloTexto.trim(), equipo:equipoElegido(),
            tarifaId:w.opcion || null, precio:w.opcion && S.tarifas[w.opcion] ? S.tarifas[w.opcion].precio : null, condicion:w.condicion || null, capacidad:w.capacidad || null, preferencia:w.flujo === 'vender' ? w.preferencia : null };
      w.enviando = true; w.err = ''; T.scheduleRender();
      try {
        w.hecho = await T.agendar({ fecha:w.fecha, hora:w.hora, motivo, modalidad:w.modalidad, direccion:w.modalidad === 'domicilio' ? w.direccion.trim() : '', nota:w.nota.trim(), origen:'sitio', cotizacion:cot, contacto:{ nombre:w.nombre.trim(), tel:w.tel, correo:w.correo.trim(), tecmi:w.tecmi } });
        w.paso = 'listo'; U.wScroll = true;
        T.cargarOcupacion();
      } catch (e) { w.err = e.message; }
      w.enviando = false; T.scheduleRender();
    }
  }
});
})();

</script>
<script>
window.TS.start("sitio");
</script>
</body>
</html>

<script>
/* Consola interna de Tecno-Spot: estructura común de todos los módulos.
   Cada archivo de esta carpeta agrega su vista, sus acciones y sus panel
   laterales a window.TSC; z-registro.js registra la herramienta al final. */
(function(){
'use strict';
const T = window.TS, U = T.U, S = T.S, esc = T.esc;
const C = window.TSC = { vistas:{}, drawers:{}, acciones:{}, formularios:{}, cambios:[] };

C.MODULOS = [
  ['hoy','Hoy en la cafetería','Atención'], ['citas','Citas','Atención'], ['ordenes','Órdenes de servicio','Atención'],
  ['ventas','Punto de venta','Ventas'], ['compras','Compra y toma a cuenta','Ventas'], ['caja','Caja','Ventas'],
  ['clientes','Clientes','Clientes'], ['garantias','Garantías','Clientes'],
  ['inventario','Inventario','Almacén'], ['precios','Precios y catálogo','Almacén'],
  ['ajustes','Ajustes','Administración'], ['accesos','Accesos','Administración']
];
const supa = () => T.Store.mode === 'supabase';
/* Lo que cada rol puede hacer en pantalla. Con Supabase, además lo hace cumplir la base. */
C.puede = {
  costos: () => T.verCostos(),
  vender: () => U.rol !== 'tecnico',
  precios: () => U.rol === 'direccion' || U.rol === 'administracion',
  ajustes: () => U.rol === 'direccion'
};
C.modulos = () => C.MODULOS.filter(([k]) => ({ ventas:C.puede.vender(), compras:C.puede.vender(), caja:C.puede.vender(), ajustes:C.puede.ajustes(), accesos:supa() && U.rol === 'direccion' })[k] !== false);

/* ---------- piezas de formulario ---------- */
C.opts = (pares, val, vacio) => (vacio != null ? '<option value="">' + esc(vacio) + '</option>' : '') + pares.map(([v, t]) => '<option value="' + esc(v) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>').join('');
C.sel = (bind, id, label, pares, val, vacio, extra) => '<label class="f" for="' + id + '">' + label + '<select id="' + id + '" data-bind="' + bind + '"' + (extra || '') + '>' + C.opts(pares, val, vacio) + '</select></label>';
C.inp = (bind, id, label, val, attrs) => '<label class="f" for="' + id + '">' + label + '<input id="' + id + '" data-bind="' + bind + '" value="' + esc(val == null ? '' : val) + '"' + (attrs || '') + '></label>';
C.area = (bind, id, label, val, ph) => '<label class="f" for="' + id + '">' + label + '<textarea id="' + id + '" data-bind="' + bind + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>' + esc(val || '') + '</textarea></label>';
C.chk = (bind, label, on) => '<label class="check"><input type="checkbox" data-bind="' + bind + '"' + (on ? ' checked' : '') + '><span>' + label + '</span></label>';
C.tile = (lbl, val, sub, lead) => '<div class="tile' + (lead ? ' lead' : '') + '"><div class="lbl">' + lbl + '</div><div class="val">' + val + '</div><div class="sub">' + sub + '</div></div>';
C.formas = () => T.ents(T.FORMAS_PAGO);
C.personal = () => { const p = T.cfg().personal; return [...new Set([].concat(p.tecnicos || [], p.mostrador || []))]; };
C.tecnicos = () => T.cfg().personal.tecnicos || [];
C.marcaOpts = () => T.marcasActivas().map(m => [m, m]).concat([['Otra','Otra marca']]);
C.modeloOpts = marca => T.modelosDe(marca).map(([id, m]) => [id, m.modelo]);
C.wa = (tel, texto, etiqueta) => { const l = T.waLink(tel, texto); return l ? '<a class="btn sm" href="' + esc(l) + '" target="_blank" rel="noopener">' + (etiqueta || 'WhatsApp') + '</a>' : ''; };
/* Enlace para que el cliente vea su folio; solo si el sitio ya tiene dirección pública. */
C.urlConsulta = folio => /^https?:/.test(T.LINKS.sitio || '') ? T.LINKS.sitio.replace(/\/?$/, '/') + '?folio=' + encodeURIComponent(folio) : '';
C.linkCliente = (id, txt) => id && S.clientes[id] ? '<button class="linkbtn" type="button" data-act="cli-open" data-v="' + esc(id) + '">' + esc(txt || S.clientes[id].nombre) + '</button>' : esc(txt || 'Sin cliente');
C.linkOrden = id => S.ordenes[id] ? '<button class="linkbtn mono" type="button" data-act="os-open" data-v="' + esc(id) + '">' + esc(S.ordenes[id].folio) + '</button>' : '';
C.diasTxt = n => n === 0 ? 'hoy' : n === 1 ? 'mañana' : n === -1 ? 'ayer' : n > 0 ? 'en ' + n + ' días' : 'hace ' + (-n) + ' días';

/* Marca + modelo del catálogo, o texto libre si no está. */
C.modeloCampos = (pref, x) => {
  const otra = x.marca === 'Otra' || (x.marca && !T.marcasActivas().includes(x.marca));
  return '<div class="grid2">' + C.sel(pref + '.marca', pref + '-marca', 'Marca', C.marcaOpts(), otra ? 'Otra' : x.marca, 'Elige…')
    + (x.marca && !otra ? C.sel(pref + '.modeloId', pref + '-modelo', 'Modelo', C.modeloOpts(x.marca).concat([['', '— No está en la lista —']]), x.modeloId, 'Elige…') : '')
    + (otra ? C.inp(pref + '.marcaTexto', pref + '-mt', 'Marca (texto)', x.marcaTexto) : '')
    + (otra || (x.marca && !x.modeloId) ? C.inp(pref + '.modelo', pref + '-mod', 'Modelo (texto)', x.modelo) : '') + '</div>';
};
/* Convierte lo capturado con modeloCampos en {modeloId, marca, modelo}. */
C.modeloDe = x => {
  if (x.modeloId && S.modelos[x.modeloId]) return { modeloId:x.modeloId, marca:S.modelos[x.modeloId].marca, modelo:S.modelos[x.modeloId].modelo };
  return { modeloId:null, marca:x.marca === 'Otra' ? (x.marcaTexto || '').trim() : x.marca, modelo:(x.modelo || '').trim() };
};

/* ---------- panel lateral ---------- */
C.drawer = (titulo, sub, cuerpo, extraHead) => '<div class="scrim" data-act="cerrar"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '"><div class="drawer-head"><div class="stack tight" style="flex:1;min-width:0"><h2>' + titulo + '</h2>' + (sub ? '<div class="row small muted">' + sub + '</div>' : '') + '</div>' + (extraHead || '') + '<button class="btn sm" type="button" data-act="cerrar" aria-label="Cerrar">Cerrar</button></div><div class="drawer-body">' + cuerpo + '</div></aside>';
function vDrawer(){ const d = U.drawer; if (!d || !C.drawers[d.kind]) return ''; return C.drawers[d.kind](d.id, d) || ''; }

/* ---------- marco de la consola ---------- */
function barra(){
  const who = supa() ? '<span class="pill solid">' + esc(T.quien()) + ' · ' + esc(T.ROLES[U.rol] || '') + '</span>'
    : '<label class="whoami" for="w-rol"><span>Ver como</span><select id="w-rol" data-bind="rol">' + C.opts(T.ents(T.ROLES), U.rol) + '</select></label>';
  return T.barra('Consola', '', who);
}
function vista(){
  const mods = C.modulos();
  if (!mods.some(m => m[0] === U.tab)) U.tab = 'hoy';
  const mod = mods.find(m => m[0] === U.tab);
  let grupo = '';
  const nav = mods.map(([k, t, g]) => (g !== grupo ? (grupo = g, '<span class="lado-g">' + esc(g) + '</span>') : '') + '<button type="button" data-act="tab" data-v="' + k + '"' + (U.tab === k ? ' aria-current="page"' : '') + '>' + esc(t) + C.contador(k) + '</button>').join('');
  return barra() + '<div class="consola"><nav class="lado" aria-label="Módulos">' + nav
    + (T.Store.mode === 'local' ? '<button class="btn sm quiet reset" type="button" data-act="reset-demo">Restablecer demostración</button>' : '') + '</nav>'
    + '<main class="contenido"><div class="stack"><div class="console-head"><div><div class="eyebrow">' + esc(mod[2]) + '</div><h1>' + esc(mod[1]) + '</h1></div>' + (C.cabeza[U.tab] ? C.cabeza[U.tab]() : '') + '</div>'
    + (supa() ? '' : '<p class="note">Prototipo: el rol se simula con «Ver como». Con Supabase lo decide la base de datos, y costos y utilidad solo llegan a dirección y administración.</p>')
    + C.vistas[U.tab]() + '</div></main></div>' + vDrawer();
}
C.cabeza = {};
/* Números junto al nombre del módulo: lo que pide atención. */
C.contador = k => {
  let n = 0;
  if (k === 'hoy') n = T.vals(S.citas).filter(c => c.fecha === T.hoyISO() && (c.estado === 'llego' || c.estado === 'atendiendo')).length;
  if (k === 'ordenes') n = T.vals(S.ordenes).filter(o => o.estado === 'listo').length;
  if (k === 'compras') n = T.vals(S.compras).filter(c => c.estado === 'evaluacion').length;
  return n ? ' <span class="badge">' + n + '</span>' : '';
};

C.vista = vista;
C.barra = barra;
C.acciones.tab = d => { U.tab = d.v; U.drawer = null; T.scheduleRender(); window.scrollTo(0, 0); };
C.acciones.cerrar = () => { U.drawer = null; T.scheduleRender(); };
C.acciones['reset-demo'] = () => T.confirmar('¿Borrar los cambios de este navegador y volver a los datos de demostración?', () => { T.resetDemo(); U.drawer = null; T.toast('Demostración restablecida.'); }, { ok:'Restablecer', peligro:true });
C.estado = { tab:'hoy' };
})();

</script>
<script>
/* Hoy en la cafetería: los turnos del día y lo que pide atención en el taller. */
(function(){
'use strict';
const T = window.TS, C = window.TSC, U = T.U, S = T.S, esc = T.esc, chip = T.chip;

/* Resumen de la cotización con la que llegó la cita. */
C.cotTxt = c => {
  const q = c.cotizacion; if (!q) return '';
  const p = q.problema && T.PROB[q.problema] ? T.PROB[q.problema].t : '';
  const extra = q.tipo === 'venta' ? [T.CONDICION_USADO[q.condicion] || '', q.capacidad || '', q.preferencia === 'toma' ? 'quiere cambiarlo' : 'quiere venderlo'] : [];
  return [p, q.equipo || '', q.ordenFolio ? 'orden ' + q.ordenFolio : ''].concat(extra).filter(Boolean).map(esc).join(' · ') + (q.precio != null ? ' · ' + T.fmtMoney(q.precio) : q.tipo === 'reparacion' ? ' · precio ' + T.PC : '');
};
/* Liga la cita con un cliente: el que ya tiene ese celular o uno nuevo con sus datos. */
C.clienteDeCita = id => {
  const c = S.citas[id]; if (!c) return null;
  if (c.clienteId && S.clientes[c.clienteId]) return c.clienteId;
  const ya = T.clientePorTel(c.contacto.tel);
  const cid = ya ? ya[0] : T.crearCliente(c.contacto);
  T.citaEdit(id, x => { x.clienteId = cid; });
  return cid;
};
C.cerrarCita = (id, estado, cambios, nota) => T.citaEdit(id, c => { c.estado = estado; Object.assign(c, cambios || {}); T.historialCita(c, nota || T.estadoDe(T.ESTADOS_CITA, estado)[1]); });
const recordatorio = c => 'Hola ' + (c.contacto.nombre || '').split(' ')[0] + ', te esperamos en ' + T.empresa().nombre + ' el ' + T.fmtDia(c.fecha).toLowerCase() + ' a las ' + c.hora + ' (turno ' + c.turno + ') en ' + (c.modalidad === 'domicilio' ? 'tu domicilio' : (T.empresa().lugarFrase || c.lugar)) + '. Tu folio es ' + c.folio + '.';
C.recordatorio = recordatorio;

/* Botones según el momento de la cita. */
C.accionesCita = (id, c) => {
  const b = (act, t, k) => '<button class="btn sm' + (k ? ' ' + k : '') + '" type="button" data-act="' + act + '" data-v="' + esc(id) + '">' + t + '</button>';
  if (c.estado === 'agendada') return b('ct-llego', 'Llegó', 'primary') + b('ct-noasistio', 'No asistió', 'quiet') + C.wa(c.contacto.tel, recordatorio(c), 'Recordar');
  if (c.estado === 'llego') return b('ct-atender', 'Atender', 'primary') + b('ct-noasistio', 'Se fue sin atender', 'quiet');
  if (c.estado === 'atendiendo'){
    const principal = { reparacion:'ct-recibir', entrega:'ct-entregar', compra:'ct-vender', venta:'ct-evaluar', garantia:'ct-garantia', duda:'ct-resuelto' }[c.motivo] || 'ct-resuelto';
    const todas = [['ct-recibir','Recibir equipo'],['ct-entregar','Entregar equipo'],['ct-vender','Vender'],['ct-evaluar','Evaluar equipo usado'],['ct-garantia','Garantía'],['ct-resuelto','Resuelto sin orden']];
    return todas.filter(([a]) => C.puede.vender() || (a !== 'ct-vender' && a !== 'ct-evaluar')).sort((x, y) => (x[0] === principal ? -1 : y[0] === principal ? 1 : 0)).map(([a, t]) => b(a, t, a === principal ? 'primary' : '')).join('');
  }
  const r = c.ordenId && S.ordenes[c.ordenId] ? 'Orden ' + C.linkOrden(c.ordenId) : c.ventaId && S.ventas[c.ventaId] ? 'Venta <span class="mono">' + esc(S.ventas[c.ventaId].folio) + '</span>' : c.compraId && S.compras[c.compraId] ? 'Evaluación <span class="mono">' + esc(S.compras[c.compraId].folio) + '</span>' : c.cierre && c.cierre.motivo ? esc(T.CIERRES_CITA[c.cierre.motivo] || c.cierre.motivo) : c.cierre && c.cierre.nota ? esc(c.cierre.nota) : '';
  return r ? '<span class="small muted">' + r + '</span>' : '';
};
function turno(id, c){
  const e = T.estadoDe(T.ESTADOS_CITA, c.estado), q = c.cotizacion;
  const cerrada = ['atendida','noasistio','cancelada'].includes(c.estado);
  return '<article class="turno ' + c.estado + (cerrada ? ' cerrada' : '') + '"><div class="t-num"><span>Turno</span><b>' + esc(c.turno) + '</b><span>' + esc(c.hora || '') + '</span></div><div class="t-info">'
    + '<div class="row"><button class="linkbtn" type="button" data-act="ct-open" data-v="' + esc(id) + '">' + esc(T.nombreCita(c)) + '</button>' + (c.contacto.tecmi ? '<span class="tag demo">Tecmilenio</span>' : '') + (c.modalidad === 'domicilio' ? chip('warn', 'A domicilio') : '') + '<span class="spacer"></span>' + chip(e[2], e[1]) + '</div>'
    + '<div class="small"><b>' + esc(T.MOTIVOS_CITA[c.motivo] || c.motivo) + '</b>' + (q ? ' · ' + C.cotTxt(c) : '') + (q && q.precio != null && S.tarifas[q.tarifaId] && S.tarifas[q.tarifaId].demo ? ' ' + T.DEMO_TAG : '') + '</div>'
    + (c.nota ? '<div class="small muted">“' + esc(c.nota) + '”</div>' : '')
    + '<div class="row acciones">' + C.accionesCita(id, c) + '</div></div></article>';
}
C.turno = turno;

function vHoy(){
  const hoy = T.hoyISO();
  const citas = T.ents(S.citas).filter(([, c]) => c.fecha === hoy && c.estado !== 'cancelada').sort((a, b) => (a[1].hora || '99').localeCompare(b[1].hora || '99') || a[1].turno - b[1].turno);
  const pend = citas.filter(([, c]) => !['atendida','noasistio'].includes(c.estado));
  const hechas = citas.filter(([, c]) => ['atendida','noasistio'].includes(c.estado));
  const ords = T.ents(S.ordenes);
  const listos = ords.filter(([, o]) => o.estado === 'listo');
  const porAut = ords.filter(([, o]) => o.estado === 'presupuesto');
  const taller = ords.filter(([, o]) => ['recibido','diagnostico','autorizado','reparacion','espera'].includes(o.estado));
  const vencidas = taller.filter(([, o]) => o.promesa && o.promesa <= hoy);
  const bajos = T.ents(S.productos).filter(([id]) => { const e = T.ex(id); return e.min != null && e.disp < e.min; });
  const ventasHoy = T.vals(S.ventas).filter(v => v.fecha === hoy).reduce((a, v) => a + (+v.total || 0), 0);
  const W = U.walk;
  const walk = W.open ? '<form class="panel stack tight" data-form="walk"><h3>Turno sin cita</h3><div class="grid2">' + C.inp('walk.nombre', 'wk-nom', 'Nombre', W.nombre) + C.inp('walk.tel', 'wk-tel', 'Celular', W.tel, ' type="tel" inputmode="numeric"')
    + C.sel('walk.motivo', 'wk-mot', 'Motivo', T.ents(T.MOTIVOS_CITA), W.motivo) + '</div>' + C.chk('walk.tecmi', 'Es de la comunidad Tecmilenio', W.tecmi)
    + '<div class="row"><button class="btn primary" type="submit">Dar turno ' + (T.vals(S.citas).filter(c => c.fecha === hoy).reduce((a, c) => Math.max(a, +c.turno || 0), 0) + 1) + '</button><button class="btn quiet" type="button" data-act="walk">Cancelar</button></div></form>' : '';
  const lista = (titulo, items, fila, vacio) => '<section class="panel stack tight"><h3>' + titulo + ' <span class="muted">(' + items.length + ')</span></h3>' + (items.length ? '<ul class="log">' + items.map(fila).join('') + '</ul>' : '<p class="muted small">' + vacio + '</p>') + '</section>';
  const filaO = extra => ([id, o]) => '<li><div class="row">' + C.linkOrden(id) + '<span>' + esc(T.nombreCliente(o.clienteId)) + '</span><span class="spacer"></span>' + extra(id, o) + '</div><span class="small muted">' + esc(T.equipoTxt(o.equipo)) + ' · ' + esc(T.PROB[o.problema] ? T.PROB[o.problema].t : '') + '</span></li>';
  const tel = o => (S.clientes[o.clienteId] || {}).tel;
  return '<div class="tiles">'
    + C.tile('Turnos de hoy', citas.length, pend.filter(([, c]) => c.estado === 'llego').length + ' esperando · ' + hechas.filter(([, c]) => c.estado === 'atendida').length + ' atendidos · ' + hechas.filter(([, c]) => c.estado === 'noasistio').length + ' no asistieron', true)
    + C.tile('Equipos en el taller', taller.length, vencidas.length ? vencidas.length + ' con fecha prometida hoy o vencida' : 'Ninguno con fecha vencida')
    + C.tile('Listos para entregar', listos.length, T.fmtMoney(listos.reduce((a, [, o]) => a + T.saldoOrden(o), 0)) + ' por cobrar')
    + C.tile('Esperando autorización', porAut.length, 'No se repara sin el sí del cliente')
    + (C.puede.vender() ? C.tile('Ventas de hoy', T.fmtMoney(ventasHoy), 'Accesorios y celulares') : '')
    + '</div><div class="hoy"><section class="stack"><div class="row"><h2>Turnos · ' + esc(T.fmtDia(hoy)) + '</h2><span class="spacer"></span>' + (W.open ? '' : '<button class="btn" type="button" data-act="walk">Turno sin cita</button>') + '</div>' + walk
    + (pend.length ? pend.map(([id, c]) => turno(id, c)).join('') : '<div class="card muted">No hay turnos pendientes por ahora.</div>')
    + (hechas.length ? '<details><summary>Ya atendidos o no asistieron (' + hechas.length + ')</summary><div class="stack tight" style="margin-top:10px">' + hechas.map(([id, c]) => turno(id, c)).join('') + '</div></details>' : '')
    + '</section><aside class="stack">'
    + lista('Listos para entregar', listos, filaO((id, o) => (T.saldoOrden(o) ? chip('warn', 'Saldo ' + T.fmtMoney(T.saldoOrden(o))) : chip('ok', 'Pagado')) + C.wa(tel(o), 'Hola ' + T.nombreCliente(o.clienteId).split(' ')[0] + ', tu ' + T.equipoTxt(o.equipo) + ' ya está listo. Pasa por él a ' + (T.empresa().lugarFrase || T.empresa().lugar) + ' con tu folio ' + o.folio + '.' + (T.saldoOrden(o) ? ' Saldo: ' + T.fmtMoney(T.saldoOrden(o)) + '.' : ''), 'Avisar')), 'Nada listo por ahora.')
    + lista('Esperando autorización', porAut, filaO((id, o) => { const h = (o.historial || []).filter(x => /presupuesto enviado/i.test(x.nota)).pop(); const d = h ? T.difDias(hoy, h.fecha) : 0; return (d >= 1 ? chip('warn', 'Hace ' + d + ' d') : chip('info', 'Hoy')) + C.wa(tel(o), 'Hola, el presupuesto de tu ' + T.equipoTxt(o.equipo) + ' es de ' + T.fmtMoney(T.totalOrden(o)) + '. ¿Lo autorizas? Folio ' + o.folio + '.' + (C.urlConsulta(o.folio) ? ' Puedes verlo y autorizarlo aquí: ' + C.urlConsulta(o.folio) : ''), 'Recordar'); }), 'Ningún presupuesto pendiente.')
    + lista('Fecha prometida hoy o vencida', vencidas, filaO((id, o) => chip(o.promesa < hoy ? 'crit' : 'warn', o.promesa < hoy ? 'Vencida ' + T.fmtD(o.promesa) : 'Hoy')), 'Todo en tiempo.')
    + lista('Bajo el mínimo de inventario', bajos, ([id, p]) => '<li><div class="row"><span>' + esc(p.nombre) + '</span><span class="spacer"></span>' + chip('crit', T.ex(id).disp + ' de ' + T.ex(id).min) + '</div>' + (p.compat ? '<span class="small muted">' + esc(p.compat) + '</span>' : '') + '</li>', 'Existencias en orden.')
    + '</aside></div>';
}
C.vistas.hoy = vHoy;
C.estado.walk = { open:false, nombre:'', tel:'', motivo:'reparacion', tecmi:false };

Object.assign(C.acciones, {
  walk(){ U.walk.open = !U.walk.open; T.scheduleRender(); },
  'ct-open'(d){ U.drawer = { kind:'cita', id:d.v }; U.ctx = { reprogramar:false, cancelar:false, fecha:'', hora:'', motivo:'cliente' }; T.scheduleRender(); },
  'ct-llego'(d){ C.cerrarCita(d.v, 'llego', { llego:T.ahoraHM() }, 'Llegó a la cafetería'); },
  'ct-atender'(d){ C.cerrarCita(d.v, 'atendiendo', { atendio:T.quien() }, 'En atención con ' + T.quien()); },
  'ct-noasistio'(d){ C.cerrarCita(d.v, 'noasistio', {}, 'No asistió'); },
  'ct-resuelto'(d){
    T.confirmar('¿Cómo se resolvió esta cita?', nota => {
      nota = (nota || '').trim();
      C.cerrarCita(d.v, 'atendida', { cierre:{ resultado:'resuelta', nota:nota || 'Resuelto sin orden', fecha:T.hoyISO() } }, 'Atendida: ' + (nota || 'resuelto sin orden'));
      const cid = C.clienteDeCita(d.v); if (cid && nota) T.bitacora(cid, { tipo:'Cita', nota });
    }, { campo:'Nota (por ejemplo: duda de garantía aclarada)', ok:'Marcar como atendida' });
  },
  'ct-recibir'(d){ C.nuevaOrden({ citaId:d.v }); },
  'ct-entregar'(d){
    const c = S.citas[d.v]; const f = c.cotizacion && c.cotizacion.ordenFolio;
    const cid = C.clienteDeCita(d.v);
    const o = T.ents(S.ordenes).find(([, x]) => (f && x.folio === f) || (x.clienteId === cid && (x.estado === 'listo' || x.estado === 'rechazado')));
    if (!o){ T.toast('No hay un equipo listo para este cliente. Revisa su ficha.', 'warn'); U.drawer = { kind:'cli', id:cid }; return T.scheduleRender(); }
    T.citaEdit(d.v, x => { x.ordenId = o[0]; });
    U.drawer = { kind:'orden', id:o[0], citaId:d.v }; C.abrirOrden(o[0]); T.scheduleRender();
  },
  'ct-vender'(d){ C.posDesdeCita(d.v); },
  'ct-evaluar'(d){ C.nuevaCompra({ citaId:d.v }); },
  'ct-garantia'(d){ const cid = C.clienteDeCita(d.v); U.drawer = { kind:'cli', id:cid }; T.toast('Revisa sus garantías y abre el reclamo desde la orden original.'); T.scheduleRender(); }
});
C.formularios.walk = () => {
  const W = U.walk;
  if (W.nombre.trim().length < 2 || T.digitos(W.tel).length !== 10){ T.toast('Escribe nombre y celular de 10 dígitos.', 'warn'); return; }
  const c = T.crearCita({ fecha:T.hoyISO(), hora:T.ahoraHM(), motivo:W.motivo, origen:'mostrador', estado:'llego', contacto:{ nombre:W.nombre, tel:W.tel, tecmi:W.tecmi } });
  U.walk = { open:false, nombre:'', tel:'', motivo:'reparacion', tecmi:false };
  T.toast('Turno ' + c.turno + ' para ' + c.contacto.nombre + '.');
};
})();

</script>
<script>
/* Citas: agenda por día, citas nuevas desde mostrador, reprogramar y cancelar con motivo. */
(function(){
'use strict';
const T = window.TS, C = window.TSC, U = T.U, S = T.S, esc = T.esc, chip = T.chip;

function vCitas(){
  const dia = U.citasDia || T.hoyISO();
  const del = T.ents(S.citas).filter(([, c]) => c.fecha === dia);
  const cupo = +T.cfg().citas.cupo || 1;
  const horas = T.horasDelDia(dia);
  const enHora = h => del.filter(([, c]) => c.hora === h && c.estado !== 'cancelada');
  const fuera = del.filter(([, c]) => c.estado === 'cancelada' || !horas.includes(c.hora));
  const prox = [];
  for (let i = 0, d = T.hoyISO(); i < 8; i++, d = T.sumarDias(d, 1)){ const n = T.vals(S.citas).filter(c => c.fecha === d && c.estado !== 'cancelada').length; prox.push([d, n]); }
  const fila = ([id, c]) => { const e = T.estadoDe(T.ESTADOS_CITA, c.estado); return '<button type="button" class="cita-mini ' + c.estado + '" data-act="ct-open" data-v="' + esc(id) + '"><b>' + esc(c.turno) + '</b><span>' + esc(T.nombreCita(c)) + '</span><span class="small muted">' + esc(T.MOTIVOS_CITA[c.motivo] || '') + '</span>' + chip(e[2], e[1]) + '</button>'; };
  return '<div class="toolbar"><button class="btn sm" type="button" data-act="ct-dia" data-v="-1" aria-label="Día anterior">←</button><button class="btn sm" type="button" data-act="ct-dia" data-v="0">Hoy</button><button class="btn sm" type="button" data-act="ct-dia" data-v="1" aria-label="Día siguiente">→</button>'
    + '<label class="f" for="ct-fecha">Día<input id="ct-fecha" type="date" data-bind="citasDia" data-live value="' + esc(dia) + '"></label><span class="spacer"></span><button class="btn primary" type="button" data-act="ct-nueva">Nueva cita</button></div>'
    + '<div class="semana">' + prox.map(([d, n]) => '<button type="button" class="dia-mini" data-act="ct-ir" data-v="' + d + '"' + (d === dia ? ' aria-current="date"' : '') + '><b>' + esc(T.fmtDiaCorto(d)) + '</b><span>' + (T.horasDelDia(d).length ? n + ' citas' : 'Cerrado') + '</span></button>').join('') + '</div>'
    + '<h2>' + esc(T.fmtDia(dia)) + '</h2>'
    + (horas.length ? '<div class="agenda">' + horas.map(h => { const cs = enHora(h); return '<div class="slot"><div class="slot-h">' + h + '<span>' + cs.length + '/' + cupo + '</span></div><div class="slot-c">' + cs.map(fila).join('') + (cs.length < cupo ? '<span class="libre">Libre</span>' : '') + '</div></div>'; }).join('') + '</div>'
      : '<div class="card muted">Este día no hay horario de citas.</div>')
    + (fuera.length ? '<section class="stack tight"><h3>Sin cita, fuera de horario o canceladas</h3><div class="slot-c">' + fuera.map(fila).join('') + '</div></section>' : '')
    + (T.cfg().citas.confirmado ? '' : '<p class="small muted">Horario de citas ' + T.PC + ': se ajusta en Ajustes.</p>');
}
C.vistas.citas = vCitas;

/* Panel de una cita. */
C.drawers.cita = id => {
  const c = S.citas[id]; if (!c) return '';
  const e = T.estadoDe(T.ESTADOS_CITA, c.estado), x = U.ctx || {};
  const q = c.cotizacion || {};
  const abierta = ['agendada','llego','atendiendo'].includes(c.estado);
  let rep = '';
  if (x.reprogramar){
    const dias = T.diasAgenda(); const f = x.fecha || dias[0];
    const hs = f ? T.horarios(f).filter(h => !h.pasada && (h.libres > 0 || (f === c.fecha && h.hora === c.hora))) : [];
    rep = '<div class="panel stack tight"><h3>Reprogramar</h3><div class="grid2">' + C.sel('ctx.fecha', 'rp-f', 'Día', dias.map(d => [d, T.fmtDia(d)]), f) + C.sel('ctx.hora', 'rp-h', 'Hora', hs.map(h => [h.hora, h.hora + ' · ' + h.libres + ' libres']), x.hora, 'Elige…') + '</div>'
      + '<div class="row"><button class="btn primary sm" type="button" data-act="ct-reprog-ok" data-v="' + esc(id) + '">Guardar nueva fecha</button><button class="btn quiet sm" type="button" data-act="ct-reprog">Cancelar</button></div></div>';
  }
  const can = x.cancelar ? '<div class="panel stack tight"><h3>Cancelar cita</h3>' + C.sel('ctx.motivo', 'cn-m', 'Motivo', T.ents(T.CIERRES_CITA), x.motivo) + '<div class="row"><button class="btn danger sm" type="button" data-act="ct-cancelar-ok" data-v="' + esc(id) + '">Cancelar la cita</button><button class="btn quiet sm" type="button" data-act="ct-cancelar">Volver</button></div></div>' : '';
  const sub = '<span class="mono">' + esc(c.folio) + '</span>' + chip(e[2], e[1]) + '<span>Turno ' + esc(c.turno) + ' · ' + esc(T.fmtDia(c.fecha)) + ' · ' + esc(c.hora) + '</span>';
  return C.drawer(esc(T.nombreCita(c)), sub,
    '<div class="row acciones">' + C.accionesCita(id, c) + '</div>'
    + '<dl class="kv"><dt>Motivo</dt><dd>' + esc(T.MOTIVOS_CITA[c.motivo] || c.motivo) + '</dd>'
    + '<dt>Celular</dt><dd>' + esc(T.telTxt(c.contacto.tel)) + ' ' + C.wa(c.contacto.tel, C.recordatorio(c), 'Recordar por WhatsApp') + '</dd>'
    + (c.contacto.correo ? '<dt>Correo</dt><dd>' + esc(c.contacto.correo) + '</dd>' : '')
    + '<dt>Comunidad Tecmilenio</dt><dd>' + (c.contacto.tecmi ? 'Sí' : 'No') + '</dd>'
    + '<dt>Dónde</dt><dd>' + esc(c.modalidad === 'domicilio' ? 'A domicilio · ' + (c.direccion || 'sin dirección') : c.lugar) + '</dd>'
    + (c.cotizacion ? '<dt>Cotización</dt><dd>' + C.cotTxt(c) + '</dd>' : '')
    + '<dt>Cliente</dt><dd>' + (c.clienteId ? C.linkCliente(c.clienteId) : '<span class="muted">Sin ficha todavía</span> <button class="btn sm quiet" type="button" data-act="ct-ligar" data-v="' + esc(id) + '">Crear o ligar ficha</button>') + '</dd>'
    + '<dt>Origen</dt><dd>' + esc({ sitio:'Sitio web', portal:'Portal del cliente', mostrador:'Mostrador' }[c.origen] || c.origen) + '</dd></dl>'
    + (c.nota ? '<p class="note">“' + esc(c.nota) + '”</p>' : '')
    + (abierta ? '<div class="row">' + (x.reprogramar || x.cancelar ? '' : '<button class="btn sm" type="button" data-act="ct-reprog">Reprogramar</button><button class="btn sm danger" type="button" data-act="ct-cancelar">Cancelar cita</button>') + '</div>' + rep + can : '')
    + '<section class="stack tight"><h3>Historial</h3><ul class="log">' + (c.historial || []).slice().reverse().map(h => '<li><span class="h">' + esc(T.fmtD(h.fecha)) + ' ' + esc(h.hora || '') + ' · ' + esc(h.autor || '') + '</span>' + esc(h.nota) + '</li>').join('') + '</ul></section>');
};

/* Cita nueva desde mostrador o por teléfono. */
C.drawers['nueva-cita'] = () => {
  const N = U.nc, dias = T.diasAgenda();
  if (!N.fecha || !dias.includes(N.fecha)) N.fecha = dias[0] || '';
  const hs = N.fecha ? T.horarios(N.fecha).filter(h => !h.pasada && h.libres > 0) : [];
  return C.drawer('Nueva cita', 'Para clientes que llaman o escriben por WhatsApp',
    '<form class="stack" data-form="nueva-cita"><div class="grid2">' + C.inp('nc.nombre', 'nc-nom', 'Nombre', N.nombre) + C.inp('nc.tel', 'nc-tel', 'Celular', N.tel, ' type="tel" inputmode="numeric"')
    + C.sel('nc.motivo', 'nc-mot', 'Motivo', T.ents(T.MOTIVOS_CITA), N.motivo) + C.sel('nc.problema', 'nc-prob', 'Problema (si es reparación)', T.PROBLEMAS.map(p => [p.id, p.t]), N.problema, '—')
    + C.sel('nc.fecha', 'nc-f', 'Día', dias.map(d => [d, T.fmtDia(d)]), N.fecha) + C.sel('nc.hora', 'nc-h', 'Hora', hs.map(h => [h.hora, h.hora + ' · ' + h.libres + ' libres']), N.hora, 'Elige…') + '</div>'
    + C.inp('nc.equipo', 'nc-eq', 'Equipo (marca y modelo)', N.equipo, ' placeholder="Por ejemplo: iPhone 12"')
    + C.area('nc.nota', 'nc-nota', 'Nota', N.nota) + C.chk('nc.tecmi', 'Es de la comunidad Tecmilenio', N.tecmi)
    + '<div class="row"><button class="btn primary" type="submit">Agendar</button></div></form>');
};
C.estado.nc = { nombre:'', tel:'', motivo:'reparacion', problema:'', fecha:'', hora:'', equipo:'', nota:'', tecmi:false };
C.estado.citasDia = '';
C.estado.ctx = {};

Object.assign(C.acciones, {
  'ct-dia'(d){ const base = U.citasDia || T.hoyISO(); U.citasDia = +d.v === 0 ? T.hoyISO() : T.sumarDias(base, +d.v); T.scheduleRender(); },
  'ct-ir'(d){ U.citasDia = d.v; T.scheduleRender(); },
  'ct-nueva'(){ U.nc = T.clone(C.estado.nc); U.drawer = { kind:'nueva-cita' }; T.scheduleRender(); },
  'ct-ligar'(d){ const cid = C.clienteDeCita(d.v); T.toast('Ficha ligada: ' + T.nombreCliente(cid) + '.'); },
  'ct-reprog'(){ U.ctx.reprogramar = !U.ctx.reprogramar; U.ctx.cancelar = false; U.ctx.fecha = ''; U.ctx.hora = ''; T.scheduleRender(); },
  'ct-cancelar'(){ U.ctx.cancelar = !U.ctx.cancelar; U.ctx.reprogramar = false; U.ctx.motivo = 'cliente'; T.scheduleRender(); },
  'ct-reprog-ok'(d){
    const x = U.ctx, f = x.fecha || T.diasAgenda()[0];
    if (!x.hora){ T.toast('Elige la nueva hora.', 'warn'); return; }
    T.citaEdit(d.v, c => { const antes = T.fmtD(c.fecha) + ' ' + c.hora; if (c.fecha !== f) c.turno = T.vals(S.citas).filter(z => z.fecha === f).reduce((a, z) => Math.max(a, +z.turno || 0), 0) + 1; c.fecha = f; c.hora = x.hora; c.estado = 'agendada'; T.historialCita(c, 'Reprogramada de ' + antes + ' a ' + T.fmtD(f) + ' ' + x.hora); });
    U.ctx.reprogramar = false; T.toast('Cita reprogramada. Avísale al cliente por WhatsApp.');
  },
  'ct-cancelar-ok'(d){ C.cerrarCita(d.v, 'cancelada', { cierre:{ motivo:U.ctx.motivo, fecha:T.hoyISO() } }, 'Cancelada · ' + (T.CIERRES_CITA[U.ctx.motivo] || '')); U.ctx.cancelar = false; }
});
C.formularios['nueva-cita'] = () => {
  const N = U.nc;
  if (N.nombre.trim().length < 2 || T.digitos(N.tel).length !== 10){ T.toast('Escribe nombre y celular de 10 dígitos.', 'warn'); return; }
  if (!N.fecha || !N.hora){ T.toast('Elige día y hora.', 'warn'); return; }
  const h = T.horarios(N.fecha).find(z => z.hora === N.hora); if (!h || !h.libres){ T.toast('Ese horario ya se llenó.', 'warn'); return; }
  const c = T.crearCita({ fecha:N.fecha, hora:N.hora, motivo:N.motivo, origen:'mostrador', nota:N.nota.trim(), contacto:{ nombre:N.nombre, tel:N.tel, tecmi:N.tecmi },
    cotizacion:N.problema || N.equipo ? { tipo:N.motivo === 'venta' ? 'venta' : 'reparacion', problema:N.problema || null, equipo:N.equipo.trim() } : null });
  U.drawer = null; U.citasDia = N.fecha;
  T.toast('Cita ' + c.folio + ' · turno ' + c.turno + ' el ' + T.fmtDia(N.fecha).toLowerCase() + ' a las ' + N.hora + '.');
};
})();

</script>
<script>
/* Órdenes de servicio: recepción con checklist, diagnóstico, presupuesto,
   autorización, reparación, entrega con garantía y hojas imprimibles. */
(function(){
'use strict';
const T = window.TS, C = window.TSC, U = T.U, S = T.S, esc = T.esc, chip = T.chip, PC = T.PC;

const COLUMNAS = [['Por diagnosticar',['recibido','diagnostico']],['Esperando autorización',['presupuesto']],['En reparación',['autorizado','reparacion','espera']],['Listos para entregar',['listo']],['Por devolver sin reparar',['rechazado']]];
const EDITABLE = ['recibido','diagnostico','presupuesto'];
const ACCESO = { ninguno:'Sin bloqueo', pin:'PIN o contraseña', patron:'Patrón', nolodejo:'No lo dejó' };
const probTxt = k => T.PROB[k] ? T.PROB[k].t : (k || '');

/* ---------- tablero de órdenes ---------- */
function tarjeta(id, o){
  const hoy = T.hoyISO(), e = T.estadoDe(T.ESTADOS_ORDEN, o.estado);
  const venc = o.promesa && T.ordenAbierta(o) && o.estado !== 'listo' && o.estado !== 'rechazado' && o.promesa < hoy;
  const bm = C.puede.costos() && T.bajoMargen(o.lineas);
  return '<button class="opp" type="button" data-act="os-open" data-v="' + esc(id) + '"><span class="row"><span class="mono">' + esc(o.folio) + '</span><span class="spacer"></span>' + chip(e[2], e[1]) + '</span>'
    + '<span class="nm">' + esc(T.nombreCliente(o.clienteId)) + '</span><span class="small">' + esc(T.equipoTxt(o.equipo)) + ' · ' + esc(probTxt(o.problema)) + '</span>'
    + '<span class="meta">' + (o.garantiaDe ? chip('info', 'Garantía') : '') + (venc ? chip('crit', 'Prometido ' + T.fmtD(o.promesa)) : o.promesa && o.estado !== 'entregado' ? chip('muted', 'Para ' + T.fmtD(o.promesa)) : '')
    + (bm ? chip('crit', 'Utilidad bajo ' + T.cfg().margenMinimo + '%') : '') + (T.sinPrecio(o.lineas) && EDITABLE.includes(o.estado) ? chip('warn', 'Sin precio') : '') + '</span>'
    + '<span class="row small muted"><span class="amt">' + (o.lineas.length ? T.fmtMoney(T.totalOrden(o)) : 'Sin presupuesto') + '</span><span class="spacer"></span>' + esc(o.tecnico || 'Sin técnico') + '</span></button>';
}
function vOrdenes(){
  const q = (U.osBusca || '').trim().toLowerCase(), tec = U.osTec || '';
  const todas = T.ents(S.ordenes).filter(([, o]) => (!tec || o.tecnico === tec) && (!q || [o.folio, T.nombreCliente(o.clienteId), T.equipoTxt(o.equipo), o.equipo.imei, (S.clientes[o.clienteId] || {}).tel].join(' ').toLowerCase().includes(q)));
  const cols = COLUMNAS.map(([t, est]) => { const os = todas.filter(([, o]) => est.includes(o.estado)).sort((a, b) => (a[1].promesa || '9').localeCompare(b[1].promesa || '9'));
    return '<section class="col" aria-label="' + esc(t) + '"><div class="col-h">' + esc(t) + '<span>' + os.length + '</span></div>' + os.map(([id, o]) => tarjeta(id, o)).join('') + '</section>'; }).join('');
  const entregadas = todas.filter(([, o]) => o.estado === 'entregado').sort((a, b) => (b[1].entrega || {}).fecha > (a[1].entrega || {}).fecha ? 1 : -1).slice(0, 12);
  return '<div class="toolbar"><label class="f" for="os-q" style="flex:1 1 260px;max-width:380px">Buscar por folio, cliente, celular, equipo o IMEI<input id="os-q" type="search" data-bind="osBusca" data-live value="' + esc(U.osBusca || '') + '"></label>'
    + C.sel('osTec', 'os-tec', 'Técnico', C.tecnicos().map(t => [t, t]), tec, 'Todos') + '<span class="spacer"></span><button class="btn primary" type="button" data-act="os-nueva">Recibir equipo</button></div>'
    + '<div class="kanban">' + cols + '</div>'
    + '<details><summary>Entregadas recientemente (' + entregadas.length + ')</summary><div class="tbl" style="margin-top:10px"><table class="t"><thead><tr><th>Folio</th><th>Cliente</th><th>Equipo</th><th>Entregada</th><th>Garantía</th></tr></thead><tbody>'
    + entregadas.map(([id, o]) => '<tr><td>' + C.linkOrden(id) + '</td><td>' + esc(T.nombreCliente(o.clienteId)) + '</td><td>' + esc(T.equipoTxt(o.equipo)) + '</td><td>' + T.fmtD(o.entrega.fecha) + '</td><td>' + (o.entrega.garantiaHasta ? (o.entrega.garantiaHasta >= T.hoyISO() ? chip('ok', 'Hasta ' + T.fmtD(o.entrega.garantiaHasta)) : chip('muted', 'Venció ' + T.fmtD(o.entrega.garantiaHasta))) : chip('muted', 'Sin reparar')) + '</td></tr>').join('')
    + '</tbody></table></div></details>';
}
C.vistas.ordenes = vOrdenes;
C.estado.osBusca = ''; C.estado.osTec = '';

/* ---------- recepción: orden nueva ---------- */
C.nuevaOrden = pre => {
  const c = pre.citaId ? S.citas[pre.citaId] : null, q = (c && c.cotizacion) || {};
  const cl = pre.clienteId ? S.clientes[pre.clienteId] : c && c.clienteId ? S.clientes[c.clienteId] : null;
  const m = q.modeloId && S.modelos[q.modeloId];
  const checklist = {}; T.CHECKLIST.forEach(([k]) => { checklist[k] = 'si'; });
  const t = q.tarifaId && S.tarifas[q.tarifaId];
  U.no = { citaId:pre.citaId || '', clienteId:(pre.clienteId || (c && c.clienteId)) || '', nombre:cl ? cl.nombre : c ? c.contacto.nombre : '', tel:cl ? cl.tel : c ? c.contacto.tel : '', correo:cl ? cl.correo || '' : c ? c.contacto.correo || '' : '', tecmi:cl ? !!cl.tecmi : c ? !!c.contacto.tecmi : false,
    eq:{ marca:m ? m.marca : (q.marca || ''), modeloId:m ? q.modeloId : '', marcaTexto:'', modelo:m ? '' : (q.modeloTexto || ''), color:'', imei:'', accesoTipo:'pin', acceso:'' },
    problema:q.problema || '', falla:c && c.nota ? c.nota : '', checklist, acc:{}, notas:'', lineas:t ? [lineaTarifa(q.tarifaId)] : [], tarifaSel:'',
    autoriza:false, anticipo:'', forma:'efectivo', tecnico:'', promesa:T.hoyISO(), modalidad:c ? c.modalidad || 'cafeteria' : 'cafeteria', direccion:c ? c.direccion || '' : '', terminos:false };
  U.drawer = { kind:'nueva-orden' }; T.scheduleRender();
};
function lineaTarifa(tid){
  const t = S.tarifas[tid] || {};
  return { tipo:'servicio', tarifaId:tid, productoId:t.refaccionId || null, desc:probTxt(t.problema) + (t.calidad ? ' · ' + t.calidad : '') + ' · ' + T.nombreModelo(t.modeloId), cant:1, precio:t.precio == null ? null : +t.precio, apartado:0 };
}
C.lineaTarifa = lineaTarifa;
C.drawers['nueva-orden'] = () => {
  const N = U.no, m = C.modeloDe(N.eq);
  const tarifas = m.modeloId && N.problema ? T.tarifasDe(m.modeloId, N.problema) : [];
  const ck = T.CHECKLIST.map(([k, t]) => '<div class="ck"><span>' + t + '</span><div class="seg">' + T.ents(T.CHECK_VALS).map(([v, vt]) => '<label><input type="radio" name="ck-' + k + '" value="' + v + '" data-bind="no.checklist.' + k + '"' + (N.checklist[k] === v ? ' checked' : '') + '><span>' + vt + '</span></label>').join('') + '</div></div>').join('');
  return C.drawer('Recibir equipo', N.citaId ? 'Desde la cita ' + esc((S.citas[N.citaId] || {}).folio || '') : 'Orden de servicio nueva',
    '<form class="stack" data-form="nueva-orden">'
    + '<section class="panel stack tight"><h3>1. Cliente</h3><div class="grid2">' + C.inp('no.nombre', 'no-nom', 'Nombre', N.nombre) + C.inp('no.tel', 'no-tel', 'Celular (WhatsApp)', N.tel, ' type="tel" inputmode="numeric"') + C.inp('no.correo', 'no-mail', 'Correo (opcional)', N.correo, ' type="email"') + '</div>'
    + C.chk('no.tecmi', 'Es de la comunidad Tecmilenio', N.tecmi) + (T.clientePorTel(N.tel) && !N.clienteId ? '<p class="small muted">Ya existe la ficha de ' + esc(T.clientePorTel(N.tel)[1].nombre) + ' con ese celular; la orden se liga a ella.</p>' : '') + '</section>'
    + '<section class="panel stack tight"><h3>2. Equipo</h3>' + C.modeloCampos('no.eq', N.eq) + '<div class="grid2">' + C.inp('no.eq.color', 'no-col', 'Color', N.eq.color) + C.inp('no.eq.imei', 'no-imei', 'IMEI o número de serie', N.eq.imei, ' inputmode="numeric" autocomplete="off"')
    + C.sel('no.eq.accesoTipo', 'no-at', 'Desbloqueo', T.ents(ACCESO), N.eq.accesoTipo) + (N.eq.accesoTipo === 'pin' || N.eq.accesoTipo === 'patron' ? C.inp('no.eq.acceso', 'no-acc', N.eq.accesoTipo === 'patron' ? 'Patrón (números del 1 al 9)' : 'PIN o contraseña', N.eq.acceso, ' autocomplete="off"') : '') + '</div>'
    + '<p class="small muted">El IMEI aparece marcando *#06#. El código de desbloqueo se borra solo al entregar el equipo.</p></section>'
    + '<section class="panel stack tight"><h3>3. Falla</h3>' + C.sel('no.problema', 'no-prob', 'Problema', T.PROBLEMAS.map(p => [p.id, p.t]), N.problema, 'Elige…') + C.area('no.falla', 'no-falla', 'Lo que cuenta el cliente', N.falla, 'Cuándo empezó y qué pasó antes') + '</section>'
    + '<section class="panel stack tight"><h3>4. Estado al recibir</h3><div class="checklist">' + ck + '</div><div class="row">' + T.ACCESORIOS_REC.map(a => C.chk('no.acc.' + a, a, N.acc[a])).join('') + '</div>' + C.area('no.notas', 'no-notas', 'Observaciones (golpes, rayones, detalles)', N.notas) + '</section>'
    + '<section class="panel stack tight"><h3>5. Presupuesto</h3>' + (N.lineas.length ? '<ul class="log">' + N.lineas.map((l, i) => '<li><div class="row"><span>' + esc(l.desc) + '</span><span class="spacer"></span><b>' + T.precioTxt(l.precio) + '</b><button class="btn sm quiet" type="button" data-act="no-quitar" data-v="' + i + '">Quitar</button></div></li>').join('') + '</ul>' : '<p class="muted small">Sin presupuesto: se arma después del diagnóstico.</p>')
    + (tarifas.length ? '<div class="row">' + C.sel('no.tarifaSel', 'no-tar', 'Agregar del catálogo', tarifas.map(([id, t]) => [id, (t.calidad || probTxt(t.problema)) + ' · ' + (t.precio == null ? 'precio por confirmar' : T.fmtMoney(t.precio))]), N.tarifaSel, 'Elige…') + '<button class="btn sm" type="button" data-act="no-agregar">Agregar</button></div>' : '')
    + (N.lineas.length && !T.sinPrecio(N.lineas) ? C.chk('no.autoriza', 'El cliente autoriza este presupuesto ahora (' + T.fmtMoney(T.montoLineas(N.lineas)) + ')', N.autoriza) : '') + '</section>'
    + '<section class="panel stack tight"><h3>6. Anticipo, técnico y fecha</h3><div class="grid2">' + C.inp('no.anticipo', 'no-ant', 'Anticipo', N.anticipo, ' type="number" min="0" step="any" inputmode="decimal"') + C.sel('no.forma', 'no-fp', 'Forma de pago', C.formas(), N.forma)
    + C.sel('no.tecnico', 'no-tec', 'Técnico', C.tecnicos().map(t => [t, t]), N.tecnico, 'Sin asignar') + C.inp('no.promesa', 'no-prom', 'Fecha prometida', N.promesa, ' type="date"') + '</div>'
    + (N.modalidad === 'domicilio' ? '<p class="small">Recolección a domicilio: ' + esc(N.direccion || 'sin dirección') + '</p>' : '') + '</section>'
    + '<section class="panel stack tight"><h3>7. Términos</h3><p class="small">' + (T.cfg().terminos.recepcion ? esc(T.cfg().terminos.recepcion) : 'Términos de recepción ' + PC + '.') + '</p>' + C.chk('no.terminos', 'El cliente revisó el estado del equipo y acepta los términos de recepción', N.terminos) + '</section>'
    + '<div class="row"><button class="btn primary lg" type="submit">Crear orden</button></div></form>');
};
Object.assign(C.acciones, {
  'os-nueva'(){ C.nuevaOrden({}); },
  'no-agregar'(){ const N = U.no; if (!N.tarifaSel) return; N.lineas.push(lineaTarifa(N.tarifaSel)); N.tarifaSel = ''; T.scheduleRender(); },
  'no-quitar'(d){ U.no.lineas.splice(+d.v, 1); U.no.autoriza = false; T.scheduleRender(); }
});
C.formularios['nueva-orden'] = () => {
  const N = U.no, m = C.modeloDe(N.eq);
  const err = N.nombre.trim().length < 2 ? 'Escribe el nombre del cliente.' : T.digitos(N.tel).length !== 10 ? 'Escribe el celular a 10 dígitos.'
    : !m.marca || !(m.modeloId || m.modelo) ? 'Elige la marca y el modelo del equipo.' : (N.eq.imei || '').replace(/\s/g, '').length < 6 ? 'Captura el IMEI o el número de serie (regla 2).'
    : !N.problema ? 'Elige el problema.' : N.falla.trim().length < 3 ? 'Escribe la falla que cuenta el cliente.' : !N.terminos ? 'El cliente debe aceptar los términos de recepción.' : '';
  if (err){ T.toast(err, 'warn'); return; }
  let cid = N.clienteId && S.clientes[N.clienteId] ? N.clienteId : (T.clientePorTel(N.tel) || [])[0];
  if (!cid) cid = T.crearCliente({ nombre:N.nombre, tel:N.tel, correo:N.correo, tecmi:N.tecmi });
  const acc = Object.keys(N.acc).filter(k => N.acc[k]);
  const r = T.crearOrden({ clienteId:cid, citaId:N.citaId || null, origen:N.citaId ? 'cita' : 'mostrador', modalidad:N.modalidad, direccion:N.direccion,
    equipo:Object.assign(m, { color:N.eq.color.trim(), imei:N.eq.imei.replace(/\s/g, ''), accesoTipo:N.eq.accesoTipo, acceso:N.eq.acceso }),
    problema:N.problema, falla:N.falla.trim(), recepcion:{ checklist:N.checklist, accesorios:acc, notas:N.notas.trim(), aceptaTerminos:true, por:T.quien(), fecha:T.hoyISO() },
    lineas:N.lineas.map(l => Object.assign({}, l)), tecnico:N.tecnico, promesa:N.promesa || null });
  T.ordenEdit(r.id, o => {
    if (+N.anticipo > 0) o.pagos.push({ fecha:T.hoyISO(), hora:T.ahoraHM(), monto:+N.anticipo, forma:N.forma, concepto:'Anticipo', por:T.quien() });
    if (N.autoriza && o.lineas.length && !T.sinPrecio(o.lineas)) T.autorizar(o, 'si', 'mostrador', '', N.nombre.trim());
  });
  if (N.citaId) C.cerrarCita(N.citaId, 'atendida', { ordenId:r.id, clienteId:cid }, 'Equipo recibido · orden ' + r.o.folio);
  C.abrirOrden(r.id); U.drawer = { kind:'orden', id:r.id };
  T.toast('Orden ' + r.o.folio + ' creada.' + (T.puedeImprimir ? ' Imprime la hoja de recepción para que el cliente la firme.' : ''));
};

/* ---------- panel de una orden ---------- */
C.abrirOrden = id => {
  const o = S.ordenes[id] || {}, cl = S.clientes[o.clienteId] || {};
  const t = (o.lineas || []).map(l => S.tarifas[l.tarifaId]).find(Boolean);
  const g = T.garantiaDias(o.problema, t);
  U.od = { linea:{ tipo:'tarifa', tarifaId:'', productoId:'', desc:'', precio:'' }, pago:{ monto:'', forma:'efectivo', concepto:'Abono' }, medio:'mostrador', motivo:'precio', rechazando:false,
    ent:{ recibio:cl.nombre || '', garantia:g == null ? '' : g, monto:'', forma:'efectivo', pruebas:{} }, nota:'', publica:false, verCodigo:false, diag:o.diagnostico || '', reclamo:'' };
};
C.acciones['os-open'] = d => { C.abrirOrden(d.v); U.drawer = { kind:'orden', id:d.v }; T.scheduleRender(); };

function accionPrincipal(id, o){
  const X = U.od, cl = S.clientes[o.clienteId] || {}, b = (act, t, k) => '<button class="btn' + (k ? ' ' + k : '') + '" type="button" data-act="' + act + '" data-v="' + esc(id) + '">' + t + '</button>';
  const url = C.urlConsulta(o.folio);
  switch (o.estado){
    case 'recibido': return '<p>Empieza por revisar el equipo.</p><div class="row">' + b('os-estado-diagnostico', 'Iniciar diagnóstico', 'primary') + '</div>';
    case 'diagnostico': return '<p>Escribe el diagnóstico y arma el presupuesto. Después envíalo al cliente: <b>no se repara sin su autorización</b>.</p><div class="row">' + b('os-enviar', 'Enviar presupuesto al cliente', 'primary') + b('os-aut-mostrador', 'Autorizó aquí en mostrador') + '</div>';
    case 'presupuesto': return '<p>Esperando que ' + esc(cl.nombre || 'el cliente') + ' autorice ' + T.fmtMoney(T.totalOrden(o)) + '.' + (url ? '' : ' También puede autorizarlo en el sitio con su folio y su celular.') + '</p>'
      + '<div class="row">' + C.wa(cl.tel, 'Hola ' + (cl.nombre || '').split(' ')[0] + ', revisamos tu ' + T.equipoTxt(o.equipo) + '. ' + (o.diagnostico ? 'Diagnóstico: ' + o.diagnostico + ' ' : '') + 'El presupuesto es de ' + T.fmtMoney(T.totalOrden(o)) + '. ¿Lo autorizas? Folio ' + o.folio + '.' + (url ? ' Puedes autorizarlo aquí: ' + url : ''), 'Enviar por WhatsApp') + '</div>'
      + (X.rechazando ? '<div class="grid2">' + C.sel('od.motivo', 'od-mot', 'Motivo', T.ents(T.RECHAZOS), X.motivo) + C.sel('od.medio', 'od-med', 'Cómo avisó', T.ents(T.MEDIOS).filter(([k]) => k !== 'sitio' && k !== 'portal'), X.medio) + '</div><div class="row">' + b('os-rechazar-ok', 'Registrar que no autorizó', 'danger') + '<button class="btn quiet" type="button" data-act="os-rechazar">Volver</button></div>'
        : '<div class="row">' + C.sel('od.medio', 'od-med', 'Cómo autorizó', T.ents(T.MEDIOS).filter(([k]) => k !== 'sitio' && k !== 'portal'), X.medio) + '</div><div class="row">' + b('os-autorizar', 'Autorizó', 'primary') + '<button class="btn danger" type="button" data-act="os-rechazar">No autorizó</button></div>');
    case 'autorizado': return '<p>Autorizado ' + esc(T.MEDIOS[o.autorizacion.medio] || '') + ' el ' + T.fmtD(o.autorizacion.fecha) + '. Las refacciones ya están apartadas.</p><div class="row">' + b('os-estado-reparacion', 'Iniciar reparación', 'primary') + '</div>';
    case 'espera': {
      const falt = (o.lineas || []).filter(l => l.productoId && (+l.apartado || 0) < (+l.cant || 0)).map(l => T.prodNombre(l.productoId));
      return '<div class="callout warn"><strong>Esperando refacción</strong>' + esc(falt.join(', ') || 'Refacción por llegar') + '. Cuando llegue, regístrala en Inventario y vuelve a revisar.</div><div class="row">' + b('os-reapartar', 'Revisar existencias otra vez', 'primary') + '</div>';
    }
    case 'reparacion': return '<p>Al terminar se descuentan las refacciones del inventario y se avisa al cliente.</p><div class="row">' + b('os-terminar', 'Reparación terminada', 'primary') + b('os-estado-espera', 'Falta una refacción') + '</div>';
    case 'listo': {

/* ---------- acciones de la orden ---------- */
const editar = (id, fn) => T.ordenEdit(id, fn);
const estado = (id, nuevo, nota, publico) => editar(id, o => { o.estado = nuevo; if (nuevo === 'diagnostico' && !o.tecnico) o.tecnico = U.rol === 'tecnico' ? T.quien() : o.tecnico; T.hist(o, nota, publico); });
Object.assign(C.acciones, {
  'os-estado-diagnostico'(d){ estado(d.v, 'diagnostico', 'En diagnóstico', true); },
  'os-estado-reparacion'(d){ estado(d.v, 'reparacion', 'En reparación', true); },
  'os-estado-espera'(d){ estado(d.v, 'espera', 'Esperando una refacción', true); },
  'os-diag'(d){ editar(d.v, o => { o.diagnostico = U.od.diag.trim(); T.hist(o, 'Diagnóstico actualizado', false); }); T.toast('Diagnóstico guardado.'); },
  'os-enviar'(d){
    const o = S.ordenes[d.v];
    if (!o.lineas.length || T.sinPrecio(o.lineas)){ T.toast('Arma el presupuesto con precio antes de enviarlo.', 'warn'); return; }
    editar(d.v, x => { x.diagnostico = U.od.diag.trim() || x.diagnostico; x.estado = 'presupuesto'; T.hist(x, 'Presupuesto enviado al cliente por ' + T.fmtMoney(T.totalOrden(x)), true); });
    T.toast('Presupuesto listo. Mándalo por WhatsApp desde el botón verde.');
  },
  'os-aut-mostrador'(d){
    const o = S.ordenes[d.v];
    if (!o.lineas.length || T.sinPrecio(o.lineas)){ T.toast('Arma el presupuesto con precio antes de autorizar.', 'warn'); return; }
    editar(d.v, x => { x.diagnostico = U.od.diag.trim() || x.diagnostico; T.autorizar(x, 'si', 'mostrador', '', T.nombreCliente(x.clienteId)); });
  },
  'os-autorizar'(d){ editar(d.v, o => { T.autorizar(o, 'si', U.od.medio, '', T.nombreCliente(o.clienteId)); }); T.toast('Autorizado. Refacciones apartadas.'); },
  'os-rechazar'(){ U.od.rechazando = !U.od.rechazando; T.scheduleRender(); },
  'os-rechazar-ok'(d){ editar(d.v, o => { T.autorizar(o, 'no', U.od.medio, U.od.motivo, T.nombreCliente(o.clienteId)); }); U.od.rechazando = false; },
  'os-reapartar'(d){ let f = 0; editar(d.v, o => { f = T.apartarOrden(o); if (!f){ o.estado = 'autorizado'; T.hist(o, 'Llegó la refacción', true); } }); T.toast(f ? 'Todavía faltan ' + f + ' pieza(s).' : 'Refacciones apartadas. Ya se puede reparar.', f ? 'warn' : ''); },
  'os-terminar'(d){
    let err = null;
    editar(d.v, o => { err = T.descontarOrden(o); if (err) return false; o.estado = 'listo'; T.hist(o, 'Reparación terminada · listo para entregar', true); });
    if (err) T.toast(err, 'crit'); else T.toast('Listo para entregar. Avísale al cliente por WhatsApp.');
  },
  'os-reabrir'(d){ T.confirmar('Reabrir el presupuesto libera las refacciones apartadas y pide una nueva autorización del cliente.', () => editar(d.v, o => { T.liberarOrden(o, 'Presupuesto reabierto'); o.autorizacion = { estado:'pendiente' }; o.estado = 'diagnostico'; T.hist(o, 'Presupuesto reabierto: necesita nueva autorización', true); }), { ok:'Reabrir presupuesto' }); },
  'os-linea'(d){
    const L = U.od.linea; let l = null;
    if (L.tipo === 'tarifa'){ if (!L.tarifaId) return T.toast('Elige un servicio.', 'warn'); l = C.lineaTarifa(L.tarifaId); }
    else if (L.tipo === 'refaccion'){ if (!L.productoId) return T.toast('Elige la refacción.', 'warn'); const p = S.productos[L.productoId]; l = { tipo:'refaccion', productoId:L.productoId, desc:p.nombre, cant:1, precio:L.precio === '' ? (p.precio == null ? null : +p.precio) : +L.precio, apartado:0 }; }
    else { if (!L.desc.trim()) return T.toast('Escribe el concepto.', 'warn'); l = { tipo:'mano', desc:L.desc.trim(), cant:1, precio:L.precio === '' ? null : +L.precio }; }
    editar(d.v, o => { o.lineas.push(l); if (o.estado === 'recibido') o.estado = 'diagnostico'; });
    U.od.linea = { tipo:L.tipo, tarifaId:'', productoId:'', desc:'', precio:'' };
  },
  'os-linea-quitar'(d){ editar(d.v, o => { o.lineas.splice(+d.i, 1); }); },
  'os-pago'(d){
    const P = U.od.pago; if (!(+P.monto > 0)) return T.toast('Escribe el monto.', 'warn');
    editar(d.v, o => { o.pagos = (o.pagos || []).concat([{ fecha:T.hoyISO(), hora:T.ahoraHM(), monto:+P.monto, forma:P.forma, concepto:P.concepto, por:T.quien() }]); T.hist(o, P.concepto + ' de ' + T.fmtMoney(+P.monto), true); });
    U.od.pago = { monto:'', forma:'efectivo', concepto:'Abono' };
  },
  'os-entregar'(d){
    const o = S.ordenes[d.v], E = U.od.ent, saldo = T.saldoOrden(o);
    const monto = saldo ? (E.monto === '' ? saldo : +E.monto) : 0;
    const err = T.entregar(d.v, { recibio:E.recibio, garantiaDias:E.garantia, pago:monto ? { monto, forma:E.forma } : null, pruebas:E.pruebas });
    if (err) return T.toast(err, 'warn');
    if (U.drawer && U.drawer.citaId) C.cerrarCita(U.drawer.citaId, 'atendida', { ordenId:d.v }, 'Equipo entregado · ' + o.folio);

  },

  'os-nota'(d){ if (!U.od.nota.trim()) return; editar(d.v, o => { T.hist(o, U.od.nota.trim(), U.od.publica); }); U.od.nota = ''; U.od.publica = false; },
  'os-print'(d){ C.imprimirOrden(d.v, d.t); }
});
/* Cambios en línea dentro de la orden (precio, cantidad, técnico, fecha). */
C.cambios.push(t => {
  const id = t.dataset.orden; if (!id || !S.ordenes[id]) return false;
  const campo = t.dataset.campo, v = t.value;
  if (t.dataset.linea != null) editar(id, o => { const l = o.lineas[+t.dataset.linea]; if (!l) return false; l[campo] = campo === 'cant' ? Math.max(1, Math.round(+v || 1)) : v === '' ? null : +v; });
  else editar(id, o => { o[campo] = v || null; if (campo === 'tecnico') T.hist(o, 'Técnico: ' + (v || 'sin asignar'), false); if (campo === 'promesa') T.hist(o, 'Fecha prometida: ' + T.fmtD(v), true); });
  return true;
});

/* ---------- hojas imprimibles ---------- */
C.imprimirOrden = (id, tipo) => {
  const o = S.ordenes[id], cl = S.clientes[o.clienteId] || {}, E = T.empresa(), cfg = T.cfg(), r = o.recepcion || {};
  const cab = '<h1>' + esc(E.nombre) + ' · ' + (tipo === 'entrega' ? 'Comprobante de entrega y garantía' : 'Hoja de recepción') + '</h1><p>Sucursal ' + esc(E.sucursal) + ' · ' + esc(E.lugar) + (E.telefono ? ' · Tel. ' + esc(E.telefono) : '') + (E.whatsapp ? ' · WhatsApp ' + esc(E.whatsapp) : '') + '</p>';
  const datos = '<table><tr><th>Folio</th><td>' + esc(o.folio) + '</td><th>Fecha</th><td>' + T.fmtD(tipo === 'entrega' && o.entrega ? o.entrega.fecha : o.creada) + '</td></tr><tr><th>Cliente</th><td>' + esc(cl.nombre || '') + '</td><th>Celular</th><td>' + esc(T.telTxt(cl.tel)) + '</td></tr>'
    + '<tr><th>Equipo</th><td>' + esc(T.equipoTxt(o.equipo)) + (o.equipo.color ? ' · ' + esc(o.equipo.color) : '') + '</td><th>IMEI o serie</th><td>' + esc(o.equipo.imei || '') + '</td></tr></table>';
  const conceptos = o.lineas.length ? '<table><tr><th>Concepto</th><th>Importe</th></tr>' + o.lineas.map(l => '<tr><td>' + esc(l.desc) + (l.cant > 1 ? ' × ' + l.cant : '') + '</td><td>' + (l.precio == null ? 'Por confirmar' : T.fmtMoney(l.precio * l.cant)) + '</td></tr>').join('') + '<tr><th>Total</th><th>' + T.fmtMoney(T.totalOrden(o)) + '</th></tr><tr><td>Pagado</td><td>' + T.fmtMoney(T.pagadoOrden(o)) + '</td></tr></table>' : '<p>El precio se confirma después del diagnóstico. No se repara sin autorización del cliente.</p>';
  let html = cab + datos;
  if (tipo === 'entrega'){
    const en = o.entrega || {};
    html += '<h2>Trabajo realizado</h2>' + conceptos + (o.diagnostico ? '<p>' + esc(o.diagnostico) + '</p>' : '')
      + '<h2>Garantía</h2><p>' + (en.reparado ? 'Vigente del ' + T.fmtD(en.fecha) + ' al <b>' + T.fmtD(en.garantiaHasta) + '</b> (' + en.garantiaDias + ' días).' : 'Equipo devuelto sin reparar: no aplica garantía.') + '</p>'
      + '<p>' + (cfg.terminos.garantia ? esc(cfg.terminos.garantia) : 'Condiciones de garantía por confirmar.') + '</p>'
      + '<p>Recibió: ' + esc(en.recibio || '') + '. El código de desbloqueo se borró del sistema al entregar.</p>'
      + '<div class="firma"><div>Firma del cliente</div><div>Entregó: ' + esc(en.por || '') + '</div></div>';
  } else {
    html += '<h2>Falla reportada</h2><p>' + esc(o.falla) + '</p><h2>Estado del equipo al recibir</h2><table>' + T.CHECKLIST.map(([k, t]) => '<tr><td>' + t + '</td><td>' + esc(T.CHECK_VALS[(r.checklist || {})[k]] || '—') + '</td></tr>').join('') + '</table>'
      + '<p>Accesorios recibidos: ' + esc((r.accesorios || []).join(', ') || 'ninguno') + '. ' + (r.notas ? 'Observaciones: ' + esc(r.notas) + '.' : '') + ' Código de desbloqueo: ' + (o.equipo.acceso ? 'lo dejó (no se imprime)' : 'no lo dejó') + '.</p>'
      + '<h2>Presupuesto</h2>' + conceptos + (o.promesa ? '<p>Fecha estimada: ' + T.fmtD(o.promesa) + '.</p>' : '')
      + '<h2>Términos</h2><p>' + (cfg.terminos.recepcion ? esc(cfg.terminos.recepcion) : 'Términos de recepción por confirmar.') + '</p>'
      + '<div class="firma"><div>Firma del cliente</div><div>Recibió: ' + esc(r.por || '') + '</div></div>';
  }
  html += '<p class="pie">Consulta el estado de tu equipo con tu folio ' + esc(o.folio) + ' y tu celular en “Mi cita y mi equipo”.</p>';
  T.imprimir(html);
};
})();

</script>
<script>
/* Punto de venta: accesorios y celulares, con toma a cuenta y ticket. */
(function(){
'use strict';
const T = window.TS, C = window.TSC, U = T.U, S = T.S, esc = T.esc, chip = T.chip, PC = T.PC;
const POS0 = { busca:'', cat:'', lineas:[], tel:'', nombre:'', clienteId:'', tomaId:'', pagos:[{ forma:'efectivo', monto:'' }], citaId:'' };
const tomasLibres = () => T.ents(S.compras).filter(([, c]) => c.tipo === 'toma' && c.estado === 'aceptada' && !c.aplicadaEn);
const equipoTxt = q => q.marca + ' ' + q.modelo + (q.capacidad ? ' ' + q.capacidad : '') + (q.color ? ' · ' + q.color : '') + ' · ' + (q.condicion === 'nuevo' ? 'nuevo' : 'seminuevo');

function vVentas(){
  const P = U.pos, q = P.busca.trim().toLowerCase(), vc = C.puede.costos();
  const prods = T.ents(S.productos).filter(([, p]) => p.tipo === 'accesorio' && !p.oculto && (!P.cat || p.categoria === P.cat) && (!q || (p.nombre + ' ' + (p.compat || '') + ' ' + (p.marca || '')).toLowerCase().includes(q)));
  const eqs = P.cat && P.cat !== 'celulares' ? [] : T.ents(S.equipos).filter(([, e]) => (e.estado === 'disponible' || e.estado === 'apartado') && (!q || (equipoTxt(e) + ' ' + e.imei).toLowerCase().includes(q)));
  const enCarrito = id => P.lineas.some(l => l.productoId === id || l.equipoId === id);
  const resultados = eqs.map(([id, e]) => '<li><div class="row"><div><b>' + esc(equipoTxt(e)) + '</b><div class="small muted">IMEI ' + esc(e.imei) + (e.bateria ? ' · batería ' + e.bateria + '%' : '') + (e.estado === 'apartado' ? ' · apartado' : '') + '</div></div><span class="spacer"></span><b>' + T.precioTxt(e.precio) + '</b><button class="btn sm" type="button" data-act="pos-add-e" data-v="' + esc(id) + '"' + (enCarrito(id) ? ' disabled' : '') + '>Agregar</button></div></li>').join('')
    + prods.map(([id, p]) => { const e = T.ex(id); return '<li><div class="row"><div><b>' + esc(p.nombre) + '</b><div class="small muted">' + esc(T.CATEGORIAS[p.categoria] || '') + (p.compat ? ' · ' + esc(p.compat) : '') + ' · ' + e.disp + ' en existencia</div></div><span class="spacer"></span><b>' + T.precioTxt(p.precio) + '</b><button class="btn sm" type="button" data-act="pos-add-p" data-v="' + esc(id) + '"' + (e.disp ? '' : ' disabled') + '>Agregar</button></div></li>'; }).join('');
  const total = T.montoLineas(P.lineas), toma = P.tomaId && S.compras[P.tomaId] ? +S.compras[P.tomaId].precio || 0 : 0, cobrar = Math.max(0, total - toma);
  const pagado = P.pagos.reduce((a, p) => a + (+p.monto || 0), 0), u = T.utilidad(P.lineas);
  const hayEquipo = P.lineas.some(l => l.equipoId);
  const clId = P.clienteId && S.clientes[P.clienteId] ? P.clienteId : (T.clientePorTel(P.tel) || [])[0], cl = clId && S.clientes[clId];
  const g = T.cfg().garantiaEquipo;
  const carrito = P.lineas.length ? '<ul class="log">' + P.lineas.map((l, i) => '<li><span>' + esc(l.desc) + '</span><div class="row"><span class="spacer"></span>'
      + (l.productoId ? '<input class="mini" type="number" min="1" step="1" aria-label="Cantidad" data-pos="' + i + '" data-campo="cant" value="' + esc(l.cant) + '">' : '')
      + '<input class="mini precio" type="number" min="0" step="any" aria-label="Precio" data-pos="' + i + '" data-campo="precio" value="' + esc(l.precio == null ? '' : l.precio) + '" placeholder="Precio">'
      + '<button class="btn sm quiet" type="button" data-act="pos-quitar" data-v="' + i + '">Quitar</button></div>'
      + (l.equipoId ? '<label class="row small">Garantía <input class="mini" type="number" min="0" step="1" data-pos="' + i + '" data-campo="garantiaDias" value="' + esc(l.garantiaDias == null ? '' : l.garantiaDias) + '" aria-label="Días de garantía"> días' + (g[S.equipos[l.equipoId].condicion === 'nuevo' ? 'nuevo' : 'seminuevo'] == null && l.garantiaDias == null ? ' ' + PC : '') + '</label>' : '') + '</li>').join('') + '</ul>'
    : '<p class="muted small">Agrega productos desde la lista.</p>';
  const hoy = T.hoyISO(), ventasHoy = T.ents(S.ventas).filter(([, v]) => v.fecha >= T.sumarDias(hoy, -6)).sort((a, b) => (b[1].fecha + b[1].hora).localeCompare(a[1].fecha + a[1].hora));
  return '<div class="pos"><section class="panel stack tight"><h3>Productos</h3><label class="f" for="pos-q">Buscar<input id="pos-q" type="search" data-bind="pos.busca" data-live value="' + esc(P.busca) + '" placeholder="Nombre, modelo o IMEI"></label>'
    + '<div class="filtros">' + [['', 'Todo'], ['celulares', 'Celulares']].concat(T.ents(T.CATEGORIAS).filter(([k]) => k !== 'refacciones')).map(([k, v]) => '<button type="button" class="filtro" data-act="pos-cat" data-v="' + k + '" aria-pressed="' + (P.cat === k) + '">' + esc(v) + '</button>').join('') + '</div>'
    + '<ul class="log resultados">' + (resultados || '<li class="muted">Nada que coincida.</li>') + '</ul></section>'
    + '<section class="panel stack tight carrito"><div class="row"><h3>Venta</h3><span class="spacer"></span>' + (P.lineas.length ? '<button class="btn sm quiet" type="button" data-act="pos-limpiar">Vaciar</button>' : '') + '</div>' + carrito
    + '<div class="grid2">' + C.inp('pos.tel', 'pos-tel', 'Celular del cliente' + (hayEquipo ? '' : ' (opcional)'), P.tel, ' type="tel" inputmode="numeric" data-live') + (cl ? '<p class="small">Cliente: ' + C.linkCliente(clId) + '</p>' : T.digitos(P.tel).length === 10 ? C.inp('pos.nombre', 'pos-nom', 'Nombre (cliente nuevo)', P.nombre) : '') + '</div>'
    + (tomasLibres().length ? C.sel('pos.tomaId', 'pos-toma', 'Toma a cuenta', tomasLibres().map(([id, c]) => [id, c.folio + ' · ' + c.vendedor.nombre + ' · ' + c.equipo.marca + ' ' + c.equipo.modelo + ' · ' + T.fmtMoney(c.precio)]), P.tomaId, 'Sin toma a cuenta') : '')
    + '<dl class="kv totales"><dt>Total</dt><dd class="num">' + T.fmtMoney(total) + '</dd>' + (toma ? '<dt>Toma a cuenta</dt><dd class="num">−' + T.fmtMoney(toma) + '</dd>' : '') + '<dt><b>A cobrar</b></dt><dd class="num"><b>' + T.fmtMoney(cobrar) + '</b></dd></dl>'
    + P.pagos.map((p, i) => '<div class="row">' + C.sel('pos.pagos.' + i + '.forma', 'pp-f' + i, 'Forma de pago', C.formas(), p.forma) + C.inp('pos.pagos.' + i + '.monto', 'pp-m' + i, 'Recibido', p.monto, ' type="number" min="0" step="any" inputmode="decimal" placeholder="' + cobrar + '" data-live') + '</div>').join('')
    + '<div class="row"><button class="btn sm quiet" type="button" data-act="pos-pago2">' + (P.pagos.length > 1 ? 'Un solo pago' : 'Pagar con dos formas') + '</button><span class="spacer"></span>' + (pagado > cobrar ? '<b>Cambio: ' + T.fmtMoney(pagado - cobrar) + '</b>' : '') + '</div>'
    + (C.puede.costos() && P.lineas.length ? '<p class="small">' + (u.pct != null ? (u.pct < T.cfg().margenMinimo ? chip('crit', 'Utilidad ' + T.pctTxt(u.pct) + ': debajo del mínimo') : chip('ok', 'Utilidad ' + T.pctTxt(u.pct))) : 'Utilidad: faltan precios') + (u.faltan ? ' <span class="muted">' + u.faltan + ' sin costo ' + PC + '</span>' : '') + '</p>' : '')
    + '<button class="btn primary lg" type="button" data-act="pos-cobrar"' + (P.lineas.length ? '' : ' disabled') + '>Cobrar ' + T.fmtMoney(cobrar) + '</button></section></div>'
    + '<section class="stack tight"><h2>Ventas de los últimos 7 días</h2><div class="tbl"><table class="t"><thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th class="num">Total</th>' + (vc ? '<th class="num">Utilidad</th>' : '') + '<th></th></tr></thead><tbody>'
    + (ventasHoy.map(([id, v]) => { const uu = T.utilidad(v.lineas); return '<tr><td class="mono">' + esc(v.folio) + '</td><td>' + T.fmtD(v.fecha) + ' ' + esc(v.hora || '') + '</td><td>' + (v.clienteId ? C.linkCliente(v.clienteId) : '<span class="muted">Mostrador</span>') + '</td><td>' + esc(v.lineas.map(l => l.desc).join(', ')) + '</td><td class="num">' + T.fmtMoney(v.total) + (v.credito ? '<div class="small muted">toma ' + T.fmtMoney(v.credito) + '</div>' : '') + '</td>'
      + (vc ? '<td class="num">' + (uu.pct != null ? T.pctTxt(uu.pct) : '—') + '</td>' : '') + '<td>' + (T.puedeImprimir ? '<button class="btn sm quiet" type="button" data-act="pos-ticket" data-v="' + esc(id) + '">Ticket</button>' : '') + '</td></tr>'; }).join('') || '<tr><td colspan="7" class="muted">Sin ventas.</td></tr>')
    + '</tbody></table></div></section>';
}
C.vistas.ventas = vVentas;
C.estado.pos = T.clone(POS0);

/* Lo que el cliente apartó en el sitio llega al punto de venta desde su turno. */
C.posDesdeCita = citaId => {
  const c = S.citas[citaId], q = (c && c.cotizacion) || {};
  U.pos = Object.assign(T.clone(POS0), { citaId, tel:c.contacto.tel, nombre:c.contacto.nombre, clienteId:c.clienteId || ((T.clientePorTel(c.contacto.tel) || [])[0] || '') });
  if (q.productoId && S.productos[q.productoId]) C.acciones['pos-add-p']({ v:q.productoId });
  if (q.equipoId && S.equipos[q.equipoId]) C.acciones['pos-add-e']({ v:q.equipoId });
  U.tab = 'ventas'; U.drawer = null; T.scheduleRender();
};
Object.assign(C.acciones, {
  'pos-cat'(d){ U.pos.cat = d.v; T.scheduleRender(); },
  'pos-add-p'(d){ const p = S.productos[d.v], l = U.pos.lineas.find(x => x.productoId === d.v); if (l) l.cant++; else U.pos.lineas.push({ productoId:d.v, desc:p.nombre + (p.compat ? ' · ' + p.compat : ''), cant:1, precio:p.precio == null ? null : +p.precio }); T.scheduleRender(); },
  'pos-add-e'(d){ const e = S.equipos[d.v], g = T.cfg().garantiaEquipo[e.condicion === 'nuevo' ? 'nuevo' : 'seminuevo']; U.pos.lineas.push({ equipoId:d.v, desc:equipoTxt(e), cant:1, precio:e.precio == null ? null : +e.precio, garantiaDias:g }); T.scheduleRender(); },
  'pos-quitar'(d){ U.pos.lineas.splice(+d.v, 1); T.scheduleRender(); },
  'pos-limpiar'(){ U.pos = T.clone(POS0); T.scheduleRender(); },
  'pos-pago2'(){ const P = U.pos; P.pagos = P.pagos.length > 1 ? [P.pagos[0]] : P.pagos.concat([{ forma:'tarjeta', monto:'' }]); T.scheduleRender(); },
  'pos-ticket'(d){ C.imprimirVenta(d.v); },
  'pos-cobrar'(){
    const P = U.pos;
    let cid = P.clienteId && S.clientes[P.clienteId] ? P.clienteId : '';
    const hayEquipo = P.lineas.some(l => l.equipoId);
    if (!cid && T.digitos(P.tel).length === 10){ const ya = T.clientePorTel(P.tel); cid = ya ? ya[0] : ''; if (!cid){ if (P.nombre.trim().length < 2) return T.toast('Escribe el nombre del cliente nuevo.', 'warn'); cid = T.crearCliente({ nombre:P.nombre, tel:P.tel }); } }
    if (hayEquipo && !cid) return T.toast('Para vender un celular captura el celular y el nombre del cliente: el equipo queda en su ficha con su IMEI.', 'warn');
    if (P.lineas.some(l => l.equipoId && !(+l.garantiaDias > 0))) return T.toast('Escribe los días de garantía del celular.', 'warn');
    const total = T.montoLineas(P.lineas), toma = P.tomaId && S.compras[P.tomaId] ? +S.compras[P.tomaId].precio || 0 : 0, cobrar = Math.max(0, total - toma);
    const pagos = P.pagos.map((p, i) => ({ forma:p.forma, monto:p.monto === '' && i === 0 && P.pagos.length === 1 ? cobrar : +p.monto || 0 }));
    const r = T.registrarVenta({ clienteId:cid || null, lineas:P.lineas.map(l => Object.assign({}, l, { garantiaDias:l.garantiaDias == null || l.garantiaDias === '' ? null : +l.garantiaDias })), pagos, tomaId:P.tomaId || null, citaId:P.citaId || null });
    if (r.err) return T.toast(r.err, 'warn');
    if (P.citaId) C.cerrarCita(P.citaId, 'atendida', { ventaId:r.id, clienteId:cid || null }, 'Venta ' + r.v.folio);
    U.pos = T.clone(POS0);
    T.toast('Venta ' + r.v.folio + (r.v.cambio ? ' · cambio ' + T.fmtMoney(r.v.cambio) : '') + '.');
    if (T.puedeImprimir) T.confirmar('Venta ' + r.v.folio + ' registrada. ¿Imprimir el ticket?', () => C.imprimirVenta(r.id), { ok:'Imprimir ticket', no:'No' });
  }
});
C.cambios.push(t => {
  if (t.dataset.pos == null) return false;
  const l = U.pos.lineas[+t.dataset.pos]; if (!l) return true;
  const c = t.dataset.campo, v = t.value;
  l[c] = c === 'cant' ? Math.max(1, Math.min(T.ex(l.productoId).disp || 1, Math.round(+v || 1))) : v === '' ? null : +v;
  T.scheduleRender(); return true;
});

C.imprimirVenta = id => {
  const v = S.ventas[id], E = T.empresa();
  T.imprimir('<h1>' + esc(E.nombre) + '</h1><p>Sucursal ' + esc(E.sucursal) + ' · ' + esc(E.lugar) + '</p><p>Ticket ' + esc(v.folio) + ' · ' + T.fmtD(v.fecha) + ' ' + esc(v.hora || '') + (v.clienteId ? ' · ' + esc(T.nombreCliente(v.clienteId)) : '') + '</p>'
    + '<table><tr><th>Producto</th><th>Cant.</th><th>Importe</th></tr>' + v.lineas.map(l => '<tr><td>' + esc(l.desc) + (l.imei ? '<br>IMEI ' + esc(l.imei) : '') + (l.garantiaHasta ? '<br>Garantía hasta ' + T.fmtD(l.garantiaHasta) : '') + '</td><td>' + l.cant + '</td><td>' + T.fmtMoney(l.precio * l.cant) + '</td></tr>').join('')
    + (v.credito ? '<tr><td colspan="2">Toma a cuenta</td><td>−' + T.fmtMoney(v.credito) + '</td></tr>' : '') + '<tr><th colspan="2">Total</th><th>' + T.fmtMoney(v.total - (v.credito || 0)) + '</th></tr>'
    + v.pagos.map(p => '<tr><td colspan="2">' + esc(T.FORMAS_PAGO[p.forma] || p.forma) + '</td><td>' + T.fmtMoney(p.monto) + '</td></tr>').join('') + (v.cambio ? '<tr><td colspan="2">Cambio</td><td>' + T.fmtMoney(v.cambio) + '</td></tr>' : '') + '</table>'
    + '<p class="pie">Atendió: ' + esc(v.vendedor || '') + '. ' + (T.cfg().terminos.garantia ? esc(T.cfg().terminos.garantia) : 'Condiciones de garantía por confirmar.') + '</p>');
};
})();

<script>
/* Compra y toma a cuenta de celulares usados. Regla 7: sin identificación,
   IMEI sin reporte y cuentas desvinculadas no se compra ni se toma a cuenta. */
(function(){
'use strict';
const T = window.TS, C = window.TSC, U = T.U, S = T.S, esc = T.esc, chip = T.chip;
const TIPOS = { compra:'Compra en efectivo', toma:'Toma a cuenta' };
const NO_CERRO = { oferta:'No aceptó la oferta', reporte:'IMEI con reporte', cuentas:'Cuentas sin desvincular', identificacion:'Sin identificación', otro:'Otro' };
const ESTADOS = { evaluacion:['Evaluando','warn'], aceptada:['Aceptada','ok'], rechazada:['No se cerró','muted'] };
const IDENT = ['INE','Pasaporte','Licencia de conducir','Credencial escolar'];

function vCompras(){
  const cs = T.ents(S.compras).sort((a, b) => (b[1].fecha || '').localeCompare(a[1].fecha || ''));
  return '<div class="toolbar"><p class="muted small" style="flex:1 1 300px">Cada equipo comprado o tomado a cuenta entra al inventario como “por reacondicionar”, con lo que se pagó como su costo.</p><button class="btn primary" type="button" data-act="ce-nueva">Evaluar un equipo</button></div>'
    + '<div class="tbl"><table class="t"><thead><tr><th>Folio</th><th>Fecha</th><th>Tipo</th><th>Vendedor</th><th>Equipo</th><th>Verificado</th><th class="num">Precio</th><th>Estado</th></tr></thead><tbody>'
    + (cs.map(([id, c]) => { const e = ESTADOS[c.estado] || ['', 'muted']; return '<tr><td><button class="linkbtn mono" type="button" data-act="ce-open" data-v="' + esc(id) + '">' + esc(c.folio) + '</button></td><td>' + T.fmtD(c.fecha) + '</td><td>' + esc(TIPOS[c.tipo]) + '</td><td>' + esc(c.vendedor.nombre) + '</td><td>' + esc(c.equipo.marca + ' ' + c.equipo.modelo) + (c.equipo.capacidad ? ' · ' + esc(c.equipo.capacidad) : '') + '</td>'
      + '<td>' + (T.compraVerificada(c) ? chip('ok', 'Completo') : chip('crit', 'Incompleto')) + '</td><td class="num">' + T.precioTxt(c.precio == null ? c.oferta : c.precio) + '</td><td>' + chip(e[1], e[0]) + (c.tipo === 'toma' && c.estado === 'aceptada' ? '<div class="small muted">' + (c.aplicadaEn ? 'Aplicada en ' + esc(c.aplicadaEn) : 'Crédito sin usar') + '</div>' : '') + (c.motivo ? '<div class="small muted">' + esc(NO_CERRO[c.motivo] || c.motivo) + '</div>' : '') + '</td></tr>'; }).join('') || '<tr><td colspan="8" class="muted">Sin evaluaciones.</td></tr>')
    + '</tbody></table></div>';
}
C.vistas.compras = vCompras;

C.nuevaCompra = pre => {
  const c = pre.citaId ? S.citas[pre.citaId] : null, q = (c && c.cotizacion) || {};
  const m = q.modeloId && S.modelos[q.modeloId];

  }
  return C.drawer(id ? 'Evaluación ' + esc(c.folio) : 'Evaluar equipo usado', X.citaId ? 'Desde la cita ' + esc((S.citas[X.citaId] || {}).folio || '') : '',
    '<form class="stack" data-form="compra"><section class="panel stack tight"><h3>Operación</h3>' + C.sel('ce.tipo', 'ce-tipo', 'Tipo', T.ents(TIPOS), X.tipo) + '</section>'
    + '<section class="panel stack tight"><h3>Quién vende</h3><div class="grid2">' + C.inp('ce.vendedor.nombre', 'ce-nom', 'Nombre completo', X.vendedor.nombre) + C.inp('ce.vendedor.tel', 'ce-tel', 'Celular', X.vendedor.tel, ' type="tel" inputmode="numeric"')

};
/* Guarda la evaluación tal como está; regresa su id. */
function guardar(){
  const X = U.ce, m = C.modeloDe(X.eq);
  if (X.vendedor.nombre.trim().length < 2) { T.toast('Escribe el nombre de quien vende.', 'warn'); return null; }

  const id = X.id || T.uid('ce'), prev = X.id ? S.compras[X.id] : null;

  T.put('compras', id, c); X.id = id;
  return id;
}
Object.assign(C.acciones, {

  'ce-no'(){ U.ce.cerrando = !U.ce.cerrando; T.scheduleRender(); },

    const c = T.clone(S.compras[id]); c.estado = 'rechazada'; c.motivo = U.ce.motivo; c.cerrada = T.hoyISO(); T.put('compras', id, c);
    if (c.citaId) C.cerrarCita(c.citaId, 'atendida', { compraId:id }, 'Evaluación sin cierre · ' + NO_CERRO[c.motivo]);
    U.drawer = { kind:'compra', id }; T.toast('Registrado: ' + NO_CERRO[c.motivo] + '.');
  },
  'ce-aceptar'(){
    const id = guardar(); if (!id) return;

  }
});
C.formularios.compra = () => { if (guardar()) { U.drawer = { kind:'compra', id:U.ce.id }; T.toast('Evaluación guardada.'); } };
})();
